<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antibiotic Coverage Matrix | Sean Sooch</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-hi: #1c2230;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --full: #3fb950;
    --partial: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    padding: 2.5rem 1.25rem 4rem;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }

  header {
    text-align: center;
    margin-bottom: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: clamp(1.75rem, 4vw, 2.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  header p {
    color: var(--text-dim);
    font-size: 0.95rem;
    margin-top: 0.5rem;
    font-style: italic;
  }

  /* Controls */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .filter-btn {
    background: var(--panel);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.9rem;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .filter-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .filter-btn.active {
    background: var(--accent);
    color: #0d1117;
    border-color: var(--accent);
  }
  .search {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.85rem;
    font-size: 0.88rem;
    font-family: inherit;
    min-width: 220px;
    flex: 1;
    max-width: 280px;
  }
  .search:focus {
    outline: none;
    border-color: var(--accent);
  }
  .search::placeholder { color: var(--text-dim); }

  /* Legend */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 1.25rem;
    margin-bottom: 1rem;
    padding: 0.75rem 1rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.82rem;
    color: var(--text-dim);
  }
  .legend-item { display: flex; align-items: center; gap: 0.5rem; }
  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .dot.full    { background: var(--full);    box-shadow: 0 0 6px rgba(63,185,80,0.35); }
  .dot.partial { background: var(--partial); box-shadow: 0 0 6px rgba(210,153,34,0.35); }
  .dot.none {
    background: transparent;
    border: 1px solid var(--border);
  }

  /* Table */
  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
    min-width: 720px;
  }
  thead th {
    background: var(--panel-hi);
    color: var(--text);
    font-weight: 600;
    padding: 0.85rem 0.65rem;
    text-align: center;
    font-size: 0.78rem;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    position: sticky;
    top: 0;
  }
  thead th.drug-col {
    text-align: left;
    padding-left: 1.1rem;
  }
  thead th .group {
    display: block;
    font-size: 0.64rem;
    font-weight: 500;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.15rem;
  }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(88,166,255,0.04); }
  tbody td {
    padding: 0.8rem 0.65rem;
    text-align: center;
  }
  tbody td.drug-name {
    text-align: left;
    padding-left: 1.1rem;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
  }
  tbody td.drug-name .klass {
    display: block;
    font-size: 0.72rem;
    font-weight: 400;
    color: var(--text-dim);
    margin-top: 0.1rem;
  }
  tbody td .dot {
    margin: 0 auto;
  }
  .hidden-col { display: none; }
  .hidden-row { display: none; }

  .empty-state {
    padding: 2rem;
    text-align: center;
    color: var(--text-dim);
    font-style: italic;
  }

  footer {
    text-align: center;
    margin-top: 2.5rem;
    color: var(--text-dim);
    font-size: 0.8rem;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 640px) {
    .controls { flex-direction: column; align-items: stretch; }
    .search { max-width: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Antibiotic Coverage Matrix</h1>
    <p>The thing you actually want at 2am on call.</p>
  </header>

  <div class="controls">
    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="gram+">Gram +</button>
      <button class="filter-btn" data-filter="gram-">Gram −</button>
      <button class="filter-btn" data-filter="anaerobes">Anaerobes</button>
      <button class="filter-btn" data-filter="atypicals">Atypicals</button>
    </div>
    <input type="text" class="search" id="search" placeholder="Filter antibiotics…">
  </div>

  <div class="legend">
    <div class="legend-item"><span class="dot full"></span> Reliable coverage</div>
    <div class="legend-item"><span class="dot partial"></span> Partial / variable</div>
    <div class="legend-item"><span class="dot none"></span> No meaningful coverage</div>
  </div>

  <div class="table-wrap">
    <table id="matrix">
      <thead>
        <tr id="head-row"></tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
    <div class="empty-state" id="empty" style="display:none;">No antibiotics match that filter.</div>
  </div>

  <footer>
    <p>Educational use only. Coverage is generalized — always check local antibiogram and clinical guidelines.</p>
    <p style="margin-top:0.4rem;"><a href="../">← Back to seansooch.dev</a></p>
  </footer>
</div>

<script>
  // Organism columns with group tags
  const ORGANISMS = [
    { key: 'mssa',    name: 'MSSA',         group: 'gram+' },
    { key: 'mrsa',    name: 'MRSA',         group: 'gram+' },
    { key: 'strep',   name: 'Strep',        group: 'gram+' },
    { key: 'entero',  name: 'Enterococcus', group: 'gram+' },
    { key: 'gnr',     name: 'GNR / Enteric',group: 'gram-' },
    { key: 'pseudo',  name: 'Pseudomonas',  group: 'gram-' },
    { key: 'anaer',   name: 'Anaerobes',    group: 'anaerobes' },
    { key: 'atyp',    name: 'Atypicals',    group: 'atypicals' }
  ];

  // Coverage: 2 = full, 1 = partial, 0 = none
  // Columns in ORGANISMS order: mssa, mrsa, strep, entero, gnr, pseudo, anaer, atyp
  const DRUGS = [
    { name: 'Penicillin G',   klass: 'Natural penicillin',     cov: [0, 0, 2, 1, 0, 0, 1, 0] },
    { name: 'Amox-Clav',      klass: 'Aminopenicillin + BLI',  cov: [2, 0, 2, 2, 1, 0, 2, 0] },
    { name: 'Nafcillin',      klass: 'Antistaph penicillin',   cov: [2, 0, 2, 0, 0, 0, 0, 0] },
    { name: 'Pip-Tazo',       klass: 'Antipseudomonal PCN',    cov: [2, 0, 2, 2, 2, 2, 2, 0] },
    { name: 'Ceftriaxone',    klass: '3rd-gen cephalosporin',  cov: [2, 0, 2, 0, 2, 0, 1, 0] },
    { name: 'Cefepime',       klass: '4th-gen cephalosporin',  cov: [2, 0, 2, 0, 2, 2, 0, 0] },
    { name: 'Meropenem',      klass: 'Carbapenem',             cov: [2, 0, 2, 1, 2, 2, 2, 0] },
    { name: 'Vancomycin',     klass: 'Glycopeptide',           cov: [2, 2, 2, 2, 0, 0, 1, 0] },
    { name: 'Azithromycin',   klass: 'Macrolide',              cov: [1, 0, 1, 0, 0, 0, 0, 2] },
    { name: 'Doxycycline',    klass: 'Tetracycline',           cov: [1, 1, 1, 0, 1, 0, 1, 2] },
    { name: 'Ciprofloxacin',  klass: 'Fluoroquinolone',        cov: [1, 0, 0, 0, 2, 2, 0, 1] },
    { name: 'Metronidazole',  klass: 'Nitroimidazole',         cov: [0, 0, 0, 0, 0, 0, 2, 0] },
    { name: 'TMP-SMX',        klass: 'Folate antagonist',      cov: [2, 2, 1, 0, 2, 0, 0, 0] }
  ];

  // Build header row
  const headRow = document.getElementById('head-row');
  const drugTh = document.createElement('th');
  drugTh.className = 'drug-col';
  drugTh.textContent = 'Antibiotic';
  headRow.appendChild(drugTh);
  ORGANISMS.forEach(org => {
    const th = document.createElement('th');
    th.dataset.group = org.group;
    th.innerHTML = '<span class="group">' + org.group.replace('gram+','Gram +').replace('gram-','Gram −').replace('anaerobes','Anaerobe').replace('atypicals','Atypical') + '</span>' + org.name;
    headRow.appendChild(th);
  });

  // Build body rows
  const body = document.getElementById('body');
  DRUGS.forEach(drug => {
    const tr = document.createElement('tr');
    tr.dataset.name = drug.name.toLowerCase();

    const nameTd = document.createElement('td');
    nameTd.className = 'drug-name';
    nameTd.innerHTML = drug.name + '<span class="klass">' + drug.klass + '</span>';
    tr.appendChild(nameTd);

    drug.cov.forEach((c, i) => {
      const td = document.createElement('td');
      td.dataset.group = ORGANISMS[i].group;
      const cls = c === 2 ? 'full' : c === 1 ? 'partial' : 'none';
      const title = (c === 2 ? 'Reliable' : c === 1 ? 'Partial / variable' : 'No coverage') + ' — ' + ORGANISMS[i].name;
      td.innerHTML = '<span class="dot ' + cls + '" title="' + title + '"></span>';
      tr.appendChild(td);
    });

    body.appendChild(tr);
  });

  // Filtering
  let activeFilter = 'all';
  let searchTerm = '';

  function applyFilters() {
    // Column filter
    const cells = document.querySelectorAll('[data-group]');
    cells.forEach(c => {
      const show = activeFilter === 'all' || c.dataset.group === activeFilter;
      c.classList.toggle('hidden-col', !show);
    });

    // Row filter (search)
    const rows = document.querySelectorAll('#body tr');
    let visibleCount = 0;
    rows.forEach(r => {
      const match = !searchTerm || r.dataset.name.includes(searchTerm);
      r.classList.toggle('hidden-row', !match);
      if (match) visibleCount++;
    });

    document.getElementById('empty').style.display = visibleCount === 0 ? 'block' : 'none';
    document.getElementById('matrix').style.display = visibleCount === 0 ? 'none' : 'table';
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      applyFilters();
    });
  });

  document.getElementById('search').addEventListener('input', (e) => {
    searchTerm = e.target.value.trim().toLowerCase();
    applyFilters();
  });
</script>
</body>
</html>
