[{"label":"HIGH anion gap (MUDPILES / GOLDMARK): added acid","causes":[{"dx":"Diabetic / alcoholic / starvation ketoacidosis","hook":"Ketones (beta-hydroxybutyrate); DKA = glucose high, AKA = recent binge then poor intake"},{"dx":"Lactic acidosis","hook":"Sepsis, shock, bowel ischemia, metformin; elevated serum lactate"},{"dx":"Uremia (renal failure)","hook":"Retained organic acids/sulfates; high BUN/Cr"},{"dx":"Toxic alcohols: methanol / ethylene glycol","hook":"Elevated OSMOLAR GAP; methanol = vision loss, ethylene glycol = oxalate crystals + renal failure"},{"dx":"Salicylate (aspirin) toxicity","hook":"Mixed high-AG metabolic acidosis + respiratory alkalosis; tinnitus"}]},{"label":"NORMAL anion gap (NAGMA): HCO3 loss or failure to excrete acid (hyperchloremic)","causes":[{"dx":"Diarrhea","hook":"GI HCO3 loss; most common NAGMA; URINE anion gap NEGATIVE (kidney appropriately excreting NH4Cl)"},{"dx":"Renal tubular acidosis (RTA)","hook":"Positive urine anion gap; Type 1 distal = urine pH >5.5 + stones + hypokalemia, Type 2 proximal = wasting + Fanconi + hypokalemia, Type 4 = HYPERkalemic / hypoaldo"},{"dx":"Carbonic anhydrase inhibitor (acetazolamide)","hook":"Renal HCO3 wasting; same mechanism as a proximal (Type 2) RTA"},{"dx":"Ureteral diversion / ileal conduit","hook":"Colon/ileum reabsorbs Cl and secretes HCO3; hyperchloremic acidosis"}]}]},"pearls":["Winter formula (check respiratory compensation in metabolic acidosis): expected PaCO2 = 1.5 x HCO3 + 8 (+/- 2). Measured CO2 higher than expected = concurrent respiratory acidosis; lower = concurrent respiratory alkalosis.","Anion gap = Na - (Cl + HCO3); normal ~12. Correct for albumin: add ~2.5 to the gap for every 1 g/dL albumin BELOW 4 (low albumin masks a real high gap).","Delta-delta in high-AG acidosis: (rise in AG) vs (fall in HCO3). Ratio \u003c1 (HCO3 dropped more than gap rose) = concurrent NAGMA; ratio >2 = concurrent metabolic alkalosis.","Urine anion gap distinguishes NAGMA: NEGATIVE (neGUTive) = GI/diarrhea (kidney excreting NH4Cl appropriately); POSITIVE = renal/RTA (kidney failing to excrete acid).","Osmolar gap (measured minus calculated osms >10) points to a toxic alcohol (methanol, ethylene glycol) in a high-AG acidosis.","Metabolic alkalosis workup: URINE CHLORIDE first (\u003c20 saline-responsive, give NS; >20 saline-resistant), then BLOOD PRESSURE to split saline-resistant (high BP = mineralocorticoid excess, normal/low BP = Bartter/Gitelman or K/Mg depletion).","Active diuretic use is the great mimic: it raises urine Cl and looks saline-resistant, so exclude recent diuretics before launching a Bartter/Gitelman or mineralocorticoid workup. Bartter mimics a loop diuretic (hyperCALCiuria), Gitelman mimics a thiazide (hypoCALCiuria + low Mg).","HCO3 from the CMP is the calculated 'total CO2'; pair it with an ABG/VBG (pH, PaCO2) to formally classify the primary disorder and compensation."]},{"id":"ag","panel":"CMP","name":"Anion Gap","abbr":"AG","normalRange":"8-12 mEq/L","units":"mEq/L","high":{"heading":"High Anion Gap (HAGMA)","note":"Elevated AG means unmeasured anions, almost always a high anion gap metabolic acidosis. Use the mnemonic GOLDMARK (or older MUDPILES). Get a VBG/ABG and check the bicarb to confirm acidosis.","groups":[{"label":"Toxic ingestions / alcohols","causes":[{"dx":"Methanol","hook":"Visual changes (snow-field blindness), retinal toxicity; elevated osmolar gap early; treat with fomepizole"},{"dx":"Ethylene glycol (antifreeze)","hook":"Calcium oxalate crystals in urine, flank pain/AKI; osmolar gap; fomepizole"},{"dx":"Propylene glycol","hook":"Diluent in IV lorazepam/phenobarbital drips; raised osmolar gap in an ICU patient on prolonged sedation"},{"dx":"Salicylate (aspirin) toxicity","hook":"Mixed picture: AG acidosis PLUS respiratory alkalosis, tinnitus, tachypnea"}]},{"label":"Ketoacidoses","causes":[{"dx":"Diabetic ketoacidosis (DKA)","hook":"Hyperglycemia + ketones; positive beta-hydroxybutyrate"},{"dx":"Alcoholic ketoacidosis","hook":"Binge then poor intake/vomiting; near-normal or low glucose, ketones positive"},{"dx":"Starvation ketoacidosis","hook":"Prolonged fasting; mild gap, glucose normal/low"}]},{"label":"Lactic acidosis","causes":[{"dx":"Type A (hypoperfusion)","hook":"Sepsis, shock, bowel/mesenteric ischemia; elevated serum lactate"},{"dx":"Type B (drugs/toxins)","hook":"Metformin (esp. in renal failure), cyanide, CO; impaired oxidative phosphorylation, lactate up without overt hypoperfusion"}]},{"label":"Renal / drug","causes":[{"dx":"Uremia (renal failure)","hook":"Retained sulfates/phosphates/organic acids; high BUN/Cr"},{"dx":"Iron / INH (isoniazid)","hook":"Iron toxicity drives lactic acidosis (free-radical/mitochondrial injury); INH overdose causes refractory seizures + lactic acidosis, give pyridoxine (B6)"},{"dx":"Paraldehyde","hook":"Historic sedative; classic mnemonic entry, essentially never seen now"}]}]},"low":{"heading":"Low Anion Gap","note":"A genuinely low AG is uncommon and is usually a lab clue rather than its own acidosis. Three distinct mechanisms: fewer unmeasured anions (low albumin), more unmeasured cations (paraproteins, lithium), or an assay artifact where a halide is misread as chloride (bromide/iodide). It does NOT cause an acidosis the way a high gap does.","groups":[{"label":"Loss of unmeasured anion (most common)","causes":[{"dx":"Hypoalbuminemia","hook":"Albumin is the main unmeasured anion; correct AG up ~2.5 per 1 g/dL drop below 4. Nephrotic syndrome, cirrhosis, malnutrition"}]},{"label":"Gain of unmeasured cation","causes":[{"dx":"Paraproteinemia (multiple myeloma)","hook":"Classic board answer: cationic IgG paraprotein adds unmeasured cation and lowers the calculated gap"},{"dx":"Lithium toxicity","hook":"Lower-yield: lithium is an unmeasured cation that can modestly lower AG; check a Li level"}]},{"label":"Lab artifact (pseudohyperchloremia)","causes":[{"dx":"Bromide / iodide intoxication","hook":"Halide is read AS chloride by the assay, so measured Cl is falsely high and the calculated AG is falsely low or even negative; not a true cation gain"}]}]},"pearls":["Anion gap is calculated, not measured: AG = Na - (Cl + HCO3). It flags an unmeasured-anion acidosis before the cause is obvious.","Correct the AG for albumin: add ~2.5 mEq/L to the measured gap for every 1 g/dL the albumin falls below 4. A 'normal' AG in a hypoalbuminemic patient can hide a true high-gap acidosis.","Mnemonics for HIGH gap: GOLDMARK (Glycols, Oxoproline, L-lactate, D-lactate, Methanol, Aspirin, Renal/uremia, Ketoacidosis) or older MUDPILES (Methanol, Uremia, DKA, Propylene glycol/Paraldehyde, Iron/INH, Lactic acidosis, Ethylene glycol, Salicylates).","Normal AG metabolic acidosis (NAGMA) is the OTHER acidosis: the gap stays normal because Cl rises to replace lost HCO3 (hyperchloremic). Think HARDASS / USED CARP: diarrhea (most common) and renal tubular acidosis. Use the urine anion gap to split GI loss (negative UAG) from RTA (positive UAG).","Delta-delta (delta ratio) screens for a mixed disorder: (measured AG - 12) / (24 - measured HCO3). \u003c1 suggests a concurrent NAGMA; >2 suggests a concurrent metabolic alkalosis or pre-existing high HCO3.","Osmolar gap pairs with the AG in suspected toxic alcohols: an elevated osmolar gap early plus a rising anion gap later points to methanol or ethylene glycol.","Single best next step when the gap is high and the cause is unclear: VBG/ABG with serum lactate, ketones (beta-hydroxybutyrate), glucose, BUN/Cr, and a calculated osmolar gap."]},{"id":"bun","panel":"CMP","name":"Blood Urea Nitrogen","abbr":"BUN","normalRange":"7-20 mg/dL","units":"mg/dL","high":{"heading":"Elevated BUN (Azotemia)","note":"Frame elevated BUN by the BUN:Cr ratio first, which localizes the problem to prerenal, intrinsic renal, or postrenal. Then add the non-renal causes that raise urea independent of GFR (GI bleed, protein load, catabolism).","groups":[{"label":"Prerenal (BUN:Cr >20:1, decreased renal perfusion, intact tubules avidly reabsorb urea)","causes":[{"dx":"Hypovolemia / dehydration","hook":"BUN:Cr >20:1, FENa \u003c1%, urine osm >500, bland sediment; responds to fluids"},{"dx":"Heart failure / cardiorenal","hook":"Low forward flow; rising BUN out of proportion to Cr while diuresing"},{"dx":"Hemorrhage / shock","hook":"Hypoperfusion plus reabsorbed urea; check hemodynamics"},{"dx":"Cirrhosis / hepatorenal","hook":"Splanchnic vasodilation, low effective volume; FENa \u003c1% with bland urine"}]},{"label":"Intrinsic renal (BUN:Cr ~10-15:1, tubular damage so urea is NOT reabsorbed, Cr rises in step)","causes":[{"dx":"Acute tubular necrosis (ATN)","hook":"FENa >2%, muddy brown granular casts, urine osm \u003c350; ischemic or nephrotoxic"},{"dx":"Acute interstitial nephritis (AIN)","hook":"Drug trigger (NSAIDs, beta-lactams, PPIs), WBC casts, eosinophiluria, rash + fever"},{"dx":"Glomerulonephritis","hook":"RBC casts, dysmorphic RBCs, proteinuria, HTN"}]},{"label":"Postrenal (obstruction; ratio variable, becomes >20:1 with backpressure-driven urea reabsorption early)","causes":[{"dx":"BPH / bladder outlet obstruction","hook":"Older man, distended bladder, large post-void residual; next step is bladder scan / Foley"},{"dx":"Bilateral ureteral obstruction (stones, malignancy, retroperitoneal fibrosis)","hook":"Hydronephrosis on renal ultrasound; must be bilateral or single functioning kidney to raise BUN"}]},{"label":"Non-renal urea load (high BUN with normal/near-normal Cr, so ratio is high)","causes":[{"dx":"Upper GI bleed","hook":"Classic: high BUN:Cr from absorbed blood protein (urea) plus prerenal hypovolemia; melena, elevated BUN with normal Cr"},{"dx":"High protein intake / tube feeds / TPN","hook":"Nitrogen load raises BUN without renal injury"},{"dx":"Catabolic states (sepsis, trauma, burns)","hook":"Increased protein breakdown raises urea production"},{"dx":"Corticosteroids","hook":"Catabolic effect increases urea generation"}]}]},"low":{"heading":"Low BUN","note":"Low BUN is far less commonly tested than elevated BUN, but it has a few board-classic associations: it signals either decreased urea production (liver) or dilution/decreased substrate. It is a supporting clue, not a primary diagnosis.","groups":[{"label":"Decreased urea synthesis","causes":[{"dx":"Liver failure / advanced cirrhosis","hook":"Urea cycle runs in the liver; failing hepatocytes make less urea (paired with high ammonia)"}]},{"label":"Decreased protein substrate","causes":[{"dx":"Malnutrition / low protein intake","hook":"Less nitrogen to convert to urea; seen with cachexia, anorexia"}]},{"label":"Dilutional / volume expansion","causes":[{"dx":"SIADH","hook":"Volume expansion dilutes BUN; low BUN and low uric acid support SIADH over other hyponatremias"},{"dx":"Overhydration / IV fluid overload","hook":"Increased GFR and dilution lower BUN"},{"dx":"Pregnancy","hook":"Physiologic plasma volume expansion plus increased GFR lowers baseline BUN (and Cr)"}]}]},"pearls":["BUN:Cr ratio is the key discriminator: >20:1 = prerenal or GI bleed (urea reabsorbed or protein-loaded); 10-15:1 = intrinsic renal (tubules cannot reabsorb urea); postrenal is variable but trends high early.","Isolated high BUN:Cr with a normal Cr and melena = upper GI bleed until proven otherwise (absorbed hemoglobin protein becomes urea).","Prerenal vs ATN: prerenal has FENa \u003c1%, urine osm >500, BUN:Cr >20; ATN has FENa >2%, urine osm \u003c350, muddy brown granular casts.","BUN is a poor standalone GFR marker because diet, catabolism, GI bleeding, steroids, and volume status all move it independent of kidney function; trend Cr and the ratio together.","Low BUN + low uric acid + euvolemic hyponatremia points toward SIADH.","Next best test for new azotemia: assess volume status, send urinalysis with microscopy plus urine electrolytes (FENa), and get a renal ultrasound if obstruction is suspected (older man, anuria, distended bladder)."]},{"id":"cr","panel":"CMP","name":"Creatinine","abbr":"Cr","normalRange":"0.6-1.2 mg/dL","units":"mg/dL","high":{"heading":"Elevated Creatinine (Azotemia)","note":"High Cr means falling GFR. First split acute (AKI) from chronic (CKD), then for AKI localize prerenal vs intrinsic vs postrenal using BUN:Cr, FENa, and urine sediment.","groups":[{"label":"Prerenal AKI (hypoperfusion, tubules intact)","causes":[{"dx":"Hypovolemia","hook":"Vomiting/diarrhea, bleeding, diuretics; BUN:Cr >20, FENa \u003c1%, bland sediment, responds to fluids"},{"dx":"Heart failure / cardiorenal","hook":"Low forward flow; prerenal indices despite total body fluid overload"},{"dx":"Hepatorenal syndrome","hook":"Cirrhosis + splanchnic vasodilation; FENa \u003c1%, no improvement with fluids, no other cause"},{"dx":"NSAIDs","hook":"Loss of prostaglandin-mediated afferent vasodilation leaves unopposed afferent (preglomerular) vasoconstriction, dropping GFR"},{"dx":"ACEi / ARB","hook":"Dilate efferent arteriole; unmasks bilateral renal artery stenosis with acute Cr rise"}]},{"label":"Intrinsic AKI (tubular/glomerular/interstitial)","causes":[{"dx":"Acute tubular necrosis (ATN)","hook":"Ischemia or nephrotoxin; muddy brown granular casts, FENa >2%, BUN:Cr 10-15"},{"dx":"Nephrotoxic ATN","hook":"Aminoglycosides, amphotericin B, IV contrast, cisplatin, myoglobin (rhabdo), tumor lysis"},{"dx":"Acute interstitial nephritis (AIN)","hook":"Drug allergy (NSAIDs, beta-lactams, PPIs, sulfa); fever, rash, eosinophilia, WBC casts/urine eosinophils"},{"dx":"Glomerulonephritis","hook":"Dysmorphic RBCs and RBC casts; HTN, proteinuria, edema (nephritic)"},{"dx":"Multiple myeloma (cast nephropathy)","hook":"Older patient, AKI + anemia + bone pain + hypercalcemia; dipstick-negative but SSA-positive urine (Bence Jones light chains missed by dipstick, which reads only albumin)"}]},{"label":"Postrenal AKI (obstruction, must be bilateral or solitary kidney)","causes":[{"dx":"BPH / prostate cancer","hook":"Older man, distended bladder; bladder outlet obstruction relieved by Foley"},{"dx":"Bilateral ureteral obstruction","hook":"Stones, retroperitoneal fibrosis, malignancy; hydronephrosis on renal ultrasound (best initial test)"},{"dx":"Neurogenic bladder","hook":"Diabetes or anticholinergics; large post-void residual"}]},{"label":"Chronic kidney disease (CKD)","causes":[{"dx":"Diabetic nephropathy","hook":"#1 cause of ESRD; albuminuria, long-standing DM, treat with ACEi/ARB"},{"dx":"Hypertensive nephrosclerosis","hook":"#2 cause; long-standing HTN"},{"dx":"CKD pattern clues","hook":"Small echogenic kidneys, anemia (low EPO), high phosphate, low Ca, high PTH, stable baseline Cr over months"}]},{"label":"Spuriously high Cr (GFR actually normal)","causes":[{"dx":"Cimetidine, trimethoprim","hook":"Block tubular secretion of creatinine; Cr rises but true GFR unchanged"},{"dx":"Cefoxitin, flucytosine","hook":"Interfere with the Jaffe assay; falsely elevated measured Cr"},{"dx":"Increased muscle / creatine intake","hook":"High muscle mass, creatine supplements, large cooked-meat meal raise Cr modestly"}]}]},"low":{"heading":"Low Creatinine","note":"A low Cr is usually benign and reflects low creatinine production (low muscle mass) or a genuinely high GFR, not kidney pathology. It rarely changes management on the shelf, but a normal-looking Cr can hide a low GFR in a frail patient.","groups":[{"label":"Decreased production (low muscle mass)","causes":[{"dx":"Elderly / frailty / sarcopenia","hook":"Low muscle mass means a normal Cr can mask a low GFR; estimate GFR, do not trust raw Cr"},{"dx":"Cachexia / malnutrition","hook":"Cancer, chronic illness; reduced creatine pool lowers Cr"},{"dx":"Amputation / muscle-wasting disease","hook":"Less muscle = less creatinine generated"}]},{"label":"Increased clearance (true high GFR)","causes":[{"dx":"Pregnancy","hook":"Plasma volume expansion raises GFR ~50%; normal pregnancy Cr is low (a 'normal' 1.0 may signal renal impairment)"}]},{"label":"Other","causes":[{"dx":"Advanced liver disease","hook":"Reduced hepatic creatine synthesis lowers Cr; in cirrhosis this masks true renal dysfunction"}]}]},"pearls":["BUN:Cr ratio: >20:1 suggests prerenal (or GI bleed); 10-15:1 suggests intrinsic renal (ATN). Postrenal starts high, then falls toward intrinsic as tubules are damaged.","FENa: \u003c1% = prerenal (kidney avidly reabsorbing Na); >2% = ATN. If on diuretics, use FEUrea instead (\u003c35% = prerenal).","Urine sediment is the key next step in AKI: muddy brown granular casts = ATN, WBC casts/eosinophils = AIN, RBC casts/dysmorphic RBCs = glomerulonephritis, bland = prerenal or postrenal.","Renal ultrasound is the best initial imaging when postrenal obstruction is suspected (looks for hydronephrosis) and shows small kidneys in CKD.","Cr lags GFR: after an acute drop in GFR, Cr rises over days, so a 'normal' Cr early does not rule out AKI. Trend matters more than a single value; a doubling of Cr means roughly halved GFR.","AKI (KDIGO) is defined as Cr rise >=0.3 mg/dL within 48h, OR >=1.5x baseline (known or presumed within the prior 7 days), OR urine output \u003c0.5 mL/kg/h for >=6h.","Cimetidine and trimethoprim (and the TMP in TMP-SMX) raise Cr by blocking tubular secretion without lowering true GFR, expect a small, stable bump.","Watch for non-Cr markers of CKD chronicity: anemia, hyperphosphatemia, hypocalcemia, elevated PTH, and small kidneys argue chronic rather than acute.","Suspect myeloma cast nephropathy when AKI comes with anemia, bone pain, and hypercalcemia and the urine dipstick is bland: dipstick detects albumin, not the filtered light chains, so order SSA test, UPEP/SPEP, and serum free light chains."]},{"id":"glu","panel":"CMP","name":"Glucose","abbr":"Glu","normalRange":"70-100 mg/dL (fasting)","units":"mg/dL","high":{"heading":"Hyperglycemia","note":"First sort: new diabetes vs stress/drug effect vs a hyperglycemic emergency (DKA vs HHS). The diagnostic cutoffs are pure points.","groups":[{"label":"Diabetes mellitus (the 4 diagnostic criteria)","causes":[{"dx":"Fasting plasma glucose","hook":">=126 mg/dL, confirmed on a repeat test (no caloric intake >=8 hr)"},{"dx":"Random glucose + classic symptoms","hook":">=200 mg/dL with polyuria, polydipsia, weight loss (does not need confirmation if symptomatic)"},{"dx":"Hemoglobin A1c","hook":">=6.5%; reflects ~3 months; falsely low in hemolysis/blood loss/recent transfusion, falsely high in iron deficiency anemia"},{"dx":"2-hr OGTT","hook":">=200 mg/dL after a 75 g load (non-pregnant criterion); note GDM uses a separate 50 g 1-hr screen then 100 g 3-hr OGTT"},{"dx":"Prediabetes","hook":"FPG 100-125, A1c 5.7-6.4%, or OGTT 140-199; lifestyle change + metformin if high risk"}]},{"label":"Hyperglycemic emergencies (DKA vs HHS)","causes":[{"dx":"DKA","hook":"classically type 1 (also ketosis-prone type 2); glucose usually 250-600, anion-gap acidosis, positive beta-hydroxybutyrate, fruity breath, Kussmaul respirations; trigger = infection or missed insulin"},{"dx":"HHS","hook":"type 2; glucose often >600 (can exceed 1000), serum osm >320, minimal/no ketones, profound dehydration with altered mental status"},{"dx":"Management of both","hook":"IV fluids first, then insulin drip; replete K+ before/with insulin (total-body K+ is depleted even when serum K+ looks normal/high); add dextrose once glucose ~200 to avoid hypoglycemia and cerebral edema"}]},{"label":"Drugs and endocrine excess","causes":[{"dx":"Glucocorticoids","hook":"steroid-induced hyperglycemia; classic post-lunch/dinner spikes on a prednisone course"},{"dx":"Thiazide diuretics","hook":"impair insulin release/sensitivity; same drug that causes hyperGlycemia, hyperLipidemia, hyperUricemia, hyperCalcemia, plus hypoNa and hypoK"},{"dx":"Cushing syndrome","hook":"cortisol excess: central obesity, striae, proximal weakness; confirm with low-dose dexamethasone suppression, 24-hr urine cortisol, or late-night salivary cortisol"},{"dx":"Other agents","hook":"atypical antipsychotics (olanzapine), protease inhibitors, tacrolimus, niacin, beta-agonists"}]},{"label":"Stress and acute illness","causes":[{"dx":"Stress hyperglycemia","hook":"counter-regulatory surge (cortisol, catecholamines) during MI, sepsis, trauma, surgery; transient, no prior diabetes"},{"dx":"Acute pancreatitis","hook":"islet destruction; hyperglycemia is one of Ranson criteria for poor prognosis"},{"dx":"Pheochromocytoma / glucagonoma","hook":"board zebras: catecholamine excess, or necrolytic migratory erythema + diabetes + weight loss"}]}]},"low":{"heading":"Hypoglycemia","note":"Whipple triad defines true hypoglycemia. The discriminating test in a workup is C-peptide (high = endogenous insulin, low = exogenous insulin).","groups":[{"label":"Drug-induced (most common cause)","causes":[{"dx":"Exogenous insulin","hook":"HIGH insulin, LOW C-peptide, negative sulfonylurea screen; think factitious (healthcare worker) or dosing error"},{"dx":"Sulfonylureas (glipizide, glyburide)","hook":"HIGH insulin AND HIGH C-peptide (stimulates endogenous release); positive sulfonylurea screen; long-acting, may need observation/octreotide"},{"dx":"Alcohol","hook":"blocks gluconeogenesis via NADH excess; binge drinking on an empty stomach, especially in the malnourished"},{"dx":"Other drugs","hook":"beta-blockers (mask symptoms), quinine, IGF-related agents, pentamidine"}]},{"label":"Endogenous hyperinsulinism","causes":[{"dx":"Insulinoma","hook":"HIGH insulin, HIGH C-peptide, NEGATIVE sulfonylurea screen; fasting hypoglycemia, Whipple triad; 72-hr fast is the test; associated with MEN1"},{"dx":"Post-gastric-bypass / dumping","hook":"late dumping: reactive postprandial hypoglycemia 1-3 hr after eating from an exaggerated insulin (incretin-driven) response"}]},{"label":"Hormone deficiency and organ failure","causes":[{"dx":"Adrenal insufficiency","hook":"loss of cortisol (gluconeogenesis driver); hypoglycemia + hyponatremia + hyperkalemia + hypotension; cosyntropin stim test"},{"dx":"Liver failure","hook":"loss of glycogen stores and gluconeogenic capacity; fulminant hepatic failure or end-stage cirrhosis"},{"dx":"Sepsis","hook":"high metabolic glucose consumption + impaired hepatic output; a late, ominous sign in severe sepsis"},{"dx":"Renal failure / poor intake","hook":"reduced insulin clearance and gluconeogenesis; also starvation, anorexia"}]}]},"pearls":["Whipple triad confirms true hypoglycemia: (1) symptoms of hypoglycemia, (2) low measured plasma glucose, (3) resolution of symptoms with glucose. Do not work up hypoglycemia without it.","C-peptide is THE discriminator in a hypoglycemia workup. HIGH C-peptide = endogenous insulin (insulinoma or sulfonylurea, so add a sulfonylurea screen to separate them). LOW C-peptide = exogenous (injected) insulin.","Corrected sodium for hyperglycemia: add ~1.6 mEq/L to measured Na for every 100 mg/dL glucose above 100. This is HYPERTONIC (translocational) hyponatremia: glucose is osmotically active and pulls water out of cells into plasma, diluting the measured Na. It is real (not the flame-photometry artifact of pseudohyponatremia from hyperlipidemia/hyperproteinemia) but it is NOT hypotonic 'dilutional' hyponatremia like SIADH; the Na normalizes once glucose is corrected.","DKA vs HHS one-liner: DKA = acidosis + ketones + moderate glucose; HHS = no ketones + extreme glucose (>600) + high osmolality + worse mental status. Treat both: fluids, then insulin, watch the K+ (total-body K+ is depleted even if serum K+ is normal or high).","A1c can be misleading: falsely LOW with anything that shortens RBC lifespan (hemolysis, recent transfusion, acute blood loss); falsely HIGH in iron deficiency anemia (older RBCs). Use fructosamine if A1c is unreliable.","Symptoms split by mechanism: adrenergic/autonomic (tremor, sweating, palpitations) appear first; neuroglycopenic (confusion, seizure, coma) appear at lower glucose. Beta-blockers blunt the adrenergic warning signs.","Pseudohypoglycemia: leukocytosis (e.g., leukemia) consumes glucose in the tube, giving a falsely low reading if processing is delayed. Use a gray-top (sodium fluoride) tube to confirm."]},{"id":"ca","panel":"CMP","name":"Calcium","abbr":"Ca","normalRange":"8.5-10.5 mg/dL (total calcium)","units":"mg/dL","high":{"heading":"Hypercalcemia","note":"Correct for albumin or check ionized Ca first. PTH is the single best next test: it splits PTH-mediated (high/inappropriately normal PTH) from non-PTH (suppressed PTH) causes. Primary hyperPTH (outpatient #1) and malignancy (inpatient #1) account for ~90%.","groups":[{"label":"PTH-mediated (high or inappropriately normal PTH)","causes":[{"dx":"Primary hyperparathyroidism","hook":"#1 outpatient cause; high Ca + high/normal PTH + low phos; usually a single adenoma; often asymptomatic on routine CMP"},{"dx":"Tertiary hyperparathyroidism","hook":"Autonomous PTH after long-standing CKD/secondary hyperPTH; high Ca + very high PTH"},{"dx":"Familial hypocalciuric hypercalcemia (FHH)","hook":"CaSR mutation; mild high Ca + high/normal PTH but LOW urine calcium (FECa \u003c1%); do NOT operate"},{"dx":"Lithium","hook":"Shifts CaSR set point; high Ca with high/normal PTH; check the med list"},{"dx":"Thiazide diuretics","hook":"Decrease urinary Ca excretion; mild high Ca with normal/high (NOT suppressed) PTH; classically unmask underlying primary hyperPTH; stop the drug and recheck"}]},{"label":"Non-PTH (suppressed PTH)","causes":[{"dx":"Malignancy: PTHrP (humoral)","hook":"#1 inpatient cause; squamous cell (lung, head/neck), renal, breast; high PTHrP, low PTH"},{"dx":"Malignancy: osteolytic mets","hook":"Multiple myeloma, breast; local bone destruction; CRAB (myeloma), lytic lesions"},{"dx":"Malignancy: 1,25-vitamin D","hook":"Lymphoma (Hodgkin/non-Hodgkin); tumor 1-alpha-hydroxylase activity"},{"dx":"Granulomatous disease","hook":"Sarcoidosis, TB; macrophage 1-alpha-hydroxylase raises 1,25-vit D; high ACE in sarcoid"},{"dx":"Vitamin D toxicity","hook":"Excess supplements; high 25-OH vit D"},{"dx":"Milk-alkali syndrome","hook":"Ca + absorbable antacid (calcium carbonate); triad of high Ca, metabolic alkalosis, AKI"},{"dx":"Immobilization","hook":"Increased bone resorption; classic in young patient with high bone turnover (Paget) or prolonged bed rest"},{"dx":"Hyperthyroidism","hook":"Thyroid hormone drives bone resorption; mild high Ca"},{"dx":"Adrenal insufficiency / vitamin A toxicity","hook":"Board-classic minor causes; remember as part of CHIMPANZEES"}]}]},"low":{"heading":"Hypocalcemia","note":"Correct for albumin first: a low total Ca with low albumin is often pseudohypocalcemia (ionized Ca normal, patient asymptomatic). Check magnesium and phosphate: the phos level helps localize the cause. Symptomatic hypocalcemia (tetany, seizures, prolonged QT) needs IV calcium.","groups":[{"label":"Low PTH (PTH cannot rise)","causes":[{"dx":"Post-surgical hypoparathyroidism","hook":"Most common cause; after total thyroidectomy or parathyroidectomy; low Ca + HIGH phos + low PTH; perioral numbness 1-3 days post-op"},{"dx":"Autoimmune hypoparathyroidism","hook":"Isolated or APS-1 (with mucocutaneous candidiasis, adrenal insufficiency)"},{"dx":"Hypomagnesemia","hook":"Mg needed for PTH secretion AND action; low Mg gives functional hypoPTH; Ca will NOT correct until Mg is replaced (alcoholics, PPIs)"},{"dx":"DiGeorge syndrome","hook":"22q11 deletion; parathyroid aplasia; low Ca + cardiac defects + absent thymus"}]},{"label":"High PTH (secondary; PTH appropriately rises)","causes":[{"dx":"Vitamin D deficiency","hook":"Low Ca + LOW phos + high PTH; poor intake, malabsorption, low sun; osteomalacia/rickets"},{"dx":"Chronic kidney disease","hook":"Low 1,25-vit D + phos retention; low Ca + HIGH phos + high PTH (secondary hyperPTH); renal osteodystrophy"},{"dx":"Pseudohypoparathyroidism","hook":"End-organ PTH resistance; low Ca + high phos + HIGH PTH; Albright hereditary osteodystrophy (short 4th/5th metacarpals)"}]},{"label":"Calcium sequestered, chelated, or precipitated","causes":[{"dx":"Acute pancreatitis","hook":"Saponification: free fatty acids bind Ca in fat necrosis; hypocalcemia is a poor-prognosis (Ranson) marker"},{"dx":"Hyperphosphatemia / tumor lysis syndrome","hook":"Phos precipitates with Ca (CaxPhos); high K, high phos, high uric acid, low Ca after chemo"},{"dx":"Rhabdomyolysis","hook":"Ca deposits in damaged muscle; high CK, high K, high phos, low Ca"},{"dx":"Citrate (massive transfusion)","hook":"Citrate anticoagulant chelates Ca; falling ionized Ca after many units of blood"}]}]},"pearls":["Corrected Ca = measured Ca + 0.8 x (4.0 minus albumin in g/dL). Low albumin lowers total Ca without lowering the physiologically active ionized Ca, so low total Ca + low albumin is often pseudohypocalcemia. When in doubt, order ionized calcium.","Hypercalcemia algorithm: the single best next test is PTH. High/normal PTH points to primary hyperPTH or FHH; suppressed PTH points to malignancy (check PTHrP) or a vitamin D/granulomatous cause (check 1,25-vit D).","Phosphate localizes hypocalcemia: low Ca + HIGH phos suggests hypoparathyroidism or CKD; low Ca + LOW phos suggests vitamin D deficiency or PTH-driven (secondary hyperPTH) states.","FHH vs primary hyperPTH: both give high Ca with high/normal PTH, but FHH has LOW urinary calcium (24-hr urine Ca or FECa \u003c1%). FHH is benign and is NOT cured by surgery.","Always replace magnesium in refractory hypocalcemia: low Mg impairs both PTH release and PTH action, and Ca will not correct until Mg is repleted.","Symptom check: hypercalcemia = stones, bones, abdominal groans, psychiatric overtones, and a SHORT QT. Hypocalcemia = Chvostek sign, Trousseau sign, tetany, and a LONG QT.","Hypercalcemia mnemonic CHIMPANZEES: Calcium supplements/milk-alkali, Hyperparathyroid/Hyperthyroid, Iatrogenic (thiazide, lithium), Multiple myeloma/Mets, Paget, Addison/Acromegaly, Neoplasm (PTHrP), Zollinger-Ellison (MEN1), Excess vitamin D, Excess vitamin A, Sarcoid/granulomatous.","First-line treatment of severe symptomatic hypercalcemia is aggressive IV normal saline; add calcitonin for fast (but short-lived) effect and a bisphosphonate for durable control. Avoid loop diuretics unless volume overloaded."]},{"id":"tp","panel":"CMP","name":"Total Protein","abbr":"TP","normalRange":"6.0-8.3 g/dL","units":"g/dL","high":{"heading":"Hyperproteinemia","note":"TP = albumin + globulins. Since albumin rarely runs high, elevated TP is almost always a globulin or water problem. Check the globulin gap (TP minus albumin); a wide gap points to paraprotein.","groups":[{"label":"Water problem (relative, not true excess)","causes":[{"dx":"Dehydration / hemoconcentration","hook":"Both albumin AND total protein rise together; concentrated blood. Albumin is also high, so the globulin gap stays normal"}]},{"label":"Excess globulin: monoclonal (paraprotein)","causes":[{"dx":"Multiple myeloma","hook":"High TP with LOW or normal albumin = wide globulin gap; M-spike on SPEP, rouleaux, CRAB (hyperCalcemia, Renal failure, Anemia, Bone lytic lesions)"},{"dx":"Waldenstrom macroglobulinemia","hook":"IgM monoclonal, hyperviscosity (blurry vision, headache, mucosal bleeding); next step SPEP/UPEP"},{"dx":"MGUS","hook":"M-spike but \u003c3 g/dL and no end-organ damage; asymptomatic, monitored"}]},{"label":"Excess globulin: polyclonal (immune drive)","causes":[{"dx":"Chronic inflammation / chronic infection","hook":"Polyclonal gammopathy: broad-based rise on SPEP, not a sharp spike (e.g. osteomyelitis, TB, autoimmune disease)"},{"dx":"Chronic liver disease (cirrhosis)","hook":"Polyclonal IgG, classic albumin-globulin (A/G) ratio reversal: albumin drops, globulins climb, so TP can look normal or high"},{"dx":"HIV / chronic viral infection","hook":"Polyclonal hypergammaglobulinemia from sustained B-cell activation"}]}]},"low":{"heading":"Hypoproteinemia","note":"Low TP usually tracks low albumin (the larger fraction). Frame by where the protein is lost or why it is not being made. Cross-reference the albumin row.","groups":[{"label":"Decreased production","causes":[{"dx":"Chronic liver disease / cirrhosis","hook":"Liver makes albumin; low albumin plus prolonged PT/INR; globulins may rise so check A/G ratio, not just TP"},{"dx":"Malnutrition","hook":"Kwashiorkor: edematous protein-deficient state; low prealbumin reflects acute status sooner"}]},{"label":"Increased loss: renal","causes":[{"dx":"Nephrotic syndrome","hook":"Proteinuria >3.5 g/day, hypoalbuminemia, edema, hyperlipidemia; frothy urine, fatty casts"}]},{"label":"Increased loss: GI","causes":[{"dx":"Protein-losing enteropathy","hook":"Protein leak across gut (Menetrier disease, IBD, lymphangiectasia); stool alpha-1 antitrypsin elevated"},{"dx":"Malabsorption","hook":"Celiac, pancreatic insufficiency; diarrhea, weight loss, fat-soluble vitamin deficits"}]},{"label":"Dilutional","causes":[{"dx":"Volume overload / overhydration","hook":"Hemodilution lowers both albumin and TP; seen with CHF, cirrhosis ascites, aggressive IV fluids"}]}]},"pearls":["Globulin gap = TP minus albumin (normal roughly 2-4 g/dL). A gap above ~4 with a high TP is the classic myeloma flag; next best test is SPEP plus UPEP (serum and urine protein electrophoresis).","A/G ratio reversal (albumin low, globulins high, ratio falls below 1) is the cirrhosis fingerprint: TP can read normal even though albumin is falling, so never trust TP alone, always pair it with the albumin row.","Monoclonal (sharp M-spike) = myeloma / Waldenstrom / MGUS; polyclonal (broad hump) = chronic infection, autoimmune disease, or liver disease.","High TP with HIGH albumin = think dehydration (everything concentrated). High TP with LOW or normal albumin = think paraprotein or inflammation (globulins doing the work).","Low TP that tracks low albumin: localize the loss. Heavy proteinuria points renal (nephrotic); a normal urine protein points GI (use stool alpha-1 antitrypsin for protein-losing enteropathy) or hepatic synthesis failure.","Prealbumin, not TP or albumin, is the better marker of acute nutritional status because of its short half-life."]},{"id":"alb","panel":"CMP","name":"Albumin","abbr":"Alb","normalRange":"3.5-5.0 g/dL","units":"g/dL","high":{"heading":"Hyperalbuminemia (relative / artifactual only)","note":"No disease overproduces albumin, so a truly high albumin is essentially always hemoconcentration: think volume, not pathology. Do not confuse hyperalbuminemia with hyperproteinemia: a high TOTAL protein with a NORMAL or LOW albumin is the paraprotein clue (multiple myeloma, Waldenstrom), not concentrated albumin.","groups":[{"label":"Hemoconcentration (the only real cause)","causes":[{"dx":"Dehydration / volume depletion","hook":"Plasma water down, so every protein concentrates: albumin, Hb/Hct, and BUN:Cr (>20:1) all rise together"},{"dx":"Prolonged tourniquet / venous stasis at draw","hook":"Pre-analytic artifact: water shifts out of the vein, falsely concentrating proteins; redraw before believing it"}]}]},"low":{"heading":"Hypoalbuminemia","note":"The high-yield direction. Frame by mechanism: make less, lose it, or dilute/shift it. Low albumin drops oncotic pressure (edema, ascites, anasarca) and lowers TOTAL calcium while ionized Ca stays normal (correct it before treating).","groups":[{"label":"Decreased synthesis (liver / nutrition)","causes":[{"dx":"Cirrhosis / chronic liver failure","hook":"Synthetic failure: low albumin + prolonged PT/INR (liver makes both); pairs with ascites and edema"},{"dx":"Kwashiorkor (protein malnutrition)","hook":"Protein-deficient intake with relatively preserved calories: edematous distended belly with low albumin; contrast marasmus (total calorie loss, no edema)"}]},{"label":"Increased loss (kidney / gut)","causes":[{"dx":"Nephrotic syndrome","hook":"Proteinuria >3.5 g/day, hypoalbuminemia, edema, hyperlipidemia; albumin spilled in urine; next step UPCR or 24h urine protein"},{"dx":"Protein-losing enteropathy","hook":"Albumin leaks into gut lumen; confirm with elevated stool alpha-1 antitrypsin"},{"dx":"Severe burns","hook":"Capillary leak and third-spacing (plus loss through denuded skin) drop albumin early"}]},{"label":"Inflammation / dilution (negative APR + third-spacing)","causes":[{"dx":"Acute inflammation / sepsis","hook":"Negative acute phase reactant: albumin falls as CRP/ferritin/fibrinogen rise; capillary leak compounds it"},{"dx":"Volume overload / dilutional","hook":"Aggressive fluid resuscitation or CHF expands plasma volume, diluting albumin"}]}]},"pearls":["Corrected Ca (mg/dL) = measured Ca + 0.8 x (4.0 - measured albumin in g/dL). Each 1.0 g/dL drop in albumin lowers TOTAL Ca by ~0.8 mg/dL while ionized (active) Ca stays normal, so the apparent low Ca is usually pseudohypocalcemia: correct before treating.","Albumin is the major determinant of plasma oncotic pressure: low albumin = edema, ascites, anasarca.","Hypoalbuminemia + edema + heavy proteinuria = nephrotic syndrome until proven otherwise; next best step is urine protein:creatinine ratio or 24-hour urine protein.","Negative acute phase reactant: in inflammation/sepsis, albumin and transferrin fall while CRP, ferritin, and fibrinogen rise. A low albumin in an acutely sick patient is usually inflammation, not malnutrition, so do not over-call protein-calorie malnutrition.","Albumin half-life is ~20 days, so it reflects chronic status. Prealbumin (transthyretin, half-life ~2 days) tracks acute nutritional change better.","Liver synthetic check: low albumin + prolonged PT/INR points to a true synthetic defect (cirrhosis) since the liver makes both; an isolated low albumin with normal INR points to loss, dilution, or inflammation instead.","Albumin vs total protein: low albumin with HIGH total protein (high globulin gap) flags a paraproteinemia, so order SPEP (multiple myeloma, Waldenstrom)."]},{"id":"tbili","panel":"CMP","name":"Total Bilirubin","abbr":"Tbili","normalRange":"0.1-1.2 mg/dL","units":"mg/dL","high":{"heading":"Hyperbilirubinemia (jaundice)","note":"First step is always: fractionate. Is it unconjugated (indirect) or conjugated (direct) predominant? That single split drives the entire differential. Clinical jaundice appears around Tbili > 2.5-3 mg/dL. (Scleral icterus can be the earliest sign.)","groups":[{"label":"Unconjugated (indirect) predominant: overproduction","causes":[{"dx":"Hemolytic anemia","hook":"Indirect hyperbilirubinemia + high LDH + low haptoglobin + reticulocytosis; check peripheral smear (schistocytes, spherocytes). Urine has NO bilirubin (unconjugated is not water-soluble), though urine urobilinogen can be high"},{"dx":"Ineffective erythropoiesis","hook":"Thalassemia, megaloblastic (B12/folate) anemia: marrow destroys RBC precursors, dumping unconjugated bili. Pigment gallstones over time"},{"dx":"Resorption of large hematoma","hook":"Indirect hyperbilirubinemia days after trauma, large GI bleed, or hemorrhage as extravasated RBCs break down"}]},{"label":"Unconjugated predominant: impaired conjugation","causes":[{"dx":"Gilbert syndrome","hook":"Mild UGT1A1 deficiency. Isolated indirect hyperbilirubinemia triggered by fasting, stress, illness, exercise. Otherwise normal LFTs, normal CBC. Benign, no treatment"},{"dx":"Crigler-Najjar syndrome","hook":"Type I: absent UGT1A1, fatal kernicterus in neonates, does NOT respond to phenobarbital. Type II: severe but partial activity, responds to phenobarbital (induces enzyme)"},{"dx":"Physiologic jaundice of the newborn","hook":"Immature UGT + high RBC turnover; appears day 2-3, peaks day 3-5, resolves by ~1-2 weeks. Indirect predominant. Benign if within normal nomogram"},{"dx":"Breast milk jaundice","hook":"Beta-glucuronidase in breast milk deconjugates bilirubin in the gut, increasing enterohepatic recirculation. Peaks ~week 2, well-fed/thriving infant, benign, continue breastfeeding. Distinct from early breastfeeding-failure (lactation) jaundice (day 2-4, poor intake/dehydration). Phototherapy if bili crosses treatment threshold; watch for kernicterus at extreme levels"}]},{"label":"Conjugated (direct) predominant: intrahepatic","causes":[{"dx":"Viral / alcoholic hepatitis","hook":"Hepatocellular injury: AST/ALT in hundreds-thousands (viral) or AST:ALT > 2 with values \u003c 500 (alcoholic). Bilirubinuria (dark urine), conjugated is water-soluble"},{"dx":"Acute liver failure (e.g., acetaminophen, ischemic, fulminant viral)","hook":"Can't-miss: AST/ALT in the thousands + rising bili + coagulopathy (high INR) + encephalopathy. Acetaminophen = N-acetylcysteine; transfer to transplant center"},{"dx":"Cirrhosis","hook":"Late-stage rising bilirubin signals decompensation; component of MELD score. Look for low albumin, high INR, thrombocytopenia"},{"dx":"Drug-induced cholestasis","hook":"Anabolic steroids, OCPs, chlorpromazine, augmentin, erythromycin. Disproportionate alk phos / direct bili rise"},{"dx":"Primary biliary cholangitis (PBC)","hook":"Middle-aged woman, fatigue + pruritus, high alk phos, positive anti-mitochondrial antibody (AMA). Treat with ursodiol"},{"dx":"Primary sclerosing cholangitis (PSC)","hook":"Young man with ulcerative colitis; MRCP shows beads-on-a-string strictures; increased cholangiocarcinoma risk. p-ANCA often positive"},{"dx":"Dubin-Johnson / Rotor syndrome","hook":"Benign isolated conjugated hyperbilirubinemia. Dubin-Johnson: black liver, defective MRP2 (canalicular) secretion. Rotor: no black liver (impaired storage). No treatment needed"}]},{"label":"Conjugated predominant: extrahepatic obstruction","causes":[{"dx":"Choledocholithiasis","hook":"Stone in common bile duct: RUQ pain, high direct bili + high alk phos/GGT. Charcot triad (fever, jaundice, RUQ pain) = ascending cholangitis, needs urgent ERCP"},{"dx":"Pancreatic head adenocarcinoma","hook":"Painless jaundice + palpable nontender gallbladder = Courvoisier sign. Weight loss, new-onset diabetes; check CA 19-9, CT pancreas protocol"},{"dx":"Cholangiocarcinoma","hook":"Painless obstructive jaundice; risk factors PSC, liver flukes. Klatskin tumor at the hilum"},{"dx":"Biliary stricture","hook":"Post-cholecystectomy or post-ERCP; obstructive pattern without a stone or mass"},{"dx":"Biliary atresia (neonatal)","hook":"Can't-miss: CONJUGATED (direct) hyperbilirubinemia in a neonate is never physiologic. Jaundice persisting beyond 2 weeks with acholic (pale) stools + dark urine. Needs urgent workup; Kasai portoenterostomy ideally before ~8 weeks"}]}]},"low":{"heading":"Low bilirubin","note":"Not clinically meaningful. Low or low-normal total bilirubin has no pathologic significance and is not worked up on the shelf. (Some data link higher-normal bilirubin to antioxidant effects, but this is not tested.)","groups":[]},"pearls":["First move on any elevated bilirubin: fractionate into direct vs indirect. > ~50% direct (conjugated) means hepatocellular or cholestatic; predominantly indirect means hemolysis, Gilbert, or a conjugation defect.","Urine bilirubin distinguishes the two: conjugated (water-soluble) spills into urine (dark urine, bilirubinuria); unconjugated does NOT, so dark urine points to a conjugated/obstructive process.","Pattern read: AST/ALT in the thousands = hepatocellular; alk phos and GGT up out of proportion to AST/ALT = cholestatic/obstructive. GGT confirms the alk phos is hepatobiliary (not bone).","AST:ALT > 2 with both \u003c 500 = alcoholic hepatitis (think 'a Scotch and a Tonic', AST > ALT). ALT > AST with very high values = viral hepatitis.","Isolated indirect hyperbilirubinemia with completely normal LFTs, normal CBC, and no hemolysis = Gilbert syndrome; classically unmasked by fasting or illness. No workup or treatment needed.","Courvoisier sign: painless jaundice + palpable, nontender gallbladder = malignant distal obstruction (pancreatic head cancer or cholangiocarcinoma), NOT gallstones (stones cause a fibrotic, nondistensible gallbladder).","Best next test for a conjugated/obstructive picture: RUQ ultrasound first to look for ductal dilation and stones; then MRCP or ERCP (ERCP is both diagnostic and therapeutic).","Conjugated hyperbilirubinemia with otherwise normal LFTs and no obstruction = Dubin-Johnson (black liver) or Rotor: benign, reassure.","Neonatal jaundice: fractionate just like in adults. INDIRECT (physiologic, breast milk, ABO/hemolytic, Crigler-Najjar) is usually benign and managed by nomogram/phototherapy; DIRECT (conjugated) in a neonate is always pathologic. Acholic stools + persistent direct hyperbilirubinemia = rule out biliary atresia urgently."]},{"id":"alp","panel":"CMP","name":"Alkaline Phosphatase","abbr":"ALP","normalRange":"40-130 U/L","units":"U/L","high":{"heading":"Elevated ALP","note":"First question on the shelf: liver or bone? Check GGT. High GGT confirms a hepatic/cholestatic source; normal GGT points to bone (or physiologic).","groups":[{"label":"Step 1: localize the source (GGT)","causes":[{"dx":"Hepatic source","hook":"GGT elevated along with ALP = cholestatic signature; fractionate or check GGT before chasing pathology"},{"dx":"Bone source","hook":"GGT normal with isolated high ALP = think bone (or growth/pregnancy)"}]},{"label":"Hepatic / cholestatic (high GGT)","causes":[{"dx":"Extrahepatic biliary obstruction (choledocholithiasis)","hook":"ALP and direct bili up out of proportion to AST/ALT; RUQ pain, dilated ducts on US, next step ERCP/MRCP"},{"dx":"Primary biliary cholangitis (PBC)","hook":"Middle-aged woman, fatigue and pruritus, anti-mitochondrial antibody (AMA) positive"},{"dx":"Primary sclerosing cholangitis (PSC)","hook":"Man with ulcerative colitis, p-ANCA, beaded strictures (onion-skin) on MRCP"},{"dx":"Pancreatic head / cholangiocarcinoma","hook":"Painless jaundice, Courvoisier sign (palpable nontender gallbladder)"},{"dx":"Drug-induced cholestasis","hook":"Augmentin, anabolic steroids, OCPs, chlorpromazine, erythromycin estolate"},{"dx":"Infiltrative liver disease","hook":"Isolated ALP elevation with normal bili: sarcoidosis, TB, lymphoma, hepatic metastases, fungal"}]},{"label":"Bone (normal GGT)","causes":[{"dx":"Paget disease of bone","hook":"Markedly isolated high ALP with normal Ca/PO4; bone pain, enlarging hat size, high-output heart failure"},{"dx":"Osteomalacia / rickets","hook":"Low vitamin D: low-normal Ca and PO4 with high ALP and high PTH; Looser zones"},{"dx":"Osteoblastic bone metastases","hook":"Prostate cancer classically; new bone formation drives ALP up"},{"dx":"Healing fracture","hook":"Transient rise from osteoblast activity during callus formation"},{"dx":"Primary hyperparathyroidism","hook":"High bone turnover: high Ca, low PO4, high PTH; advanced disease gives osteitis fibrosa cystica (brown tumors)"}]},{"label":"Physiologic (normal GGT, do not work up)","causes":[{"dx":"Growing children / adolescents","hook":"Bone growth raises ALP well above adult range; normal finding"},{"dx":"Pregnancy (3rd trimester)","hook":"Placental ALP isoenzyme; benign and expected"}]}]},"low":{"heading":"Low ALP","note":"Low ALP is rare and low-yield on the shelf. Recognize the named associations, but it is almost never the answer.","groups":[{"label":"Board-classic associations","causes":[{"dx":"Hypophosphatasia","hook":"Inherited deficiency of the ALP enzyme itself; defective bone mineralization"},{"dx":"Zinc deficiency","hook":"ALP is a zinc-dependent metalloenzyme; think malnutrition or TPN"},{"dx":"Wilson disease (fulminant)","hook":"Disproportionately low ALP with hemolysis; low ALP-to-bilirubin ratio is a clue"},{"dx":"Malnutrition / hypothyroidism","hook":"Low protein turnover and reduced bone activity; nonspecific"}]}]},"pearls":["First move with a high ALP: check GGT. High GGT confirms hepatic/cholestatic; normal GGT means bone (or growth/pregnancy). If GGT is unavailable, fractionate ALP isoenzymes or check a 5'-nucleotidase (rises in liver, not bone).","Cholestatic pattern = ALP and GGT both up, with bilirubin elevated out of proportion to AST/ALT. Contrast with a hepatocellular pattern where AST/ALT dominate.","Isolated high ALP with normal bilirubin and normal AST/ALT: think infiltrative liver disease or, if GGT is normal, bone (Paget is the classic isolated marked elevation).","Pair ALP with Ca, PO4, and PTH to nail the bone cause: osteomalacia (low/low-normal Ca and PO4, high PTH), Paget (normal Ca/PO4), primary hyperparathyroidism (high Ca, low PO4, high PTH).","Next best test for biliary obstruction: ultrasound first (look for ductal dilation and stones), then MRCP or ERCP.","PBC = AMA positive, middle-aged woman, itching. PSC = p-ANCA, man with ulcerative colitis, beaded ducts on MRCP.","Low ALP is essentially never the tested answer; remember it only as a clue in fulminant Wilson disease (low ALP:bilirubin ratio) and zinc deficiency."]},{"id":"ast","panel":"CMP","name":"Aspartate Aminotransferase","abbr":"AST","normalRange":"10-40 U/L","units":"U/L","high":{"heading":"Elevated AST (hepatocellular injury, plus non-liver sources)","note":"AST marks hepatocellular injury but is NOT liver-specific (also in heart, skeletal muscle, and RBCs). Always read it next to ALT: the two high-yield moves are (1) the AST:ALT ratio and (2) the absolute magnitude. If AST is up but ALT is normal, stop thinking liver and look for a non-liver source.","groups":[{"label":"AST:ALT ratio >2 (AST predominant): alcohol, and late cirrhosis of any cause","causes":[{"dx":"Alcoholic hepatitis","hook":"AST:ALT >2 (classically 2:1 to 3:1) with AST rarely >300-500; mnemonic AST = A Scotch and Tonic; relative deficiency of pyridoxal-5'-phosphate (active vitamin B6) limits ALT production more than AST, driving the ratio up"},{"dx":"Cirrhosis (any cause, advanced)","hook":"ratio flips to AST>ALT as fibrosis advances, even in disease that started ALT-predominant; look for synthetic failure (low albumin, high INR, high bilirubin)"}]},{"label":"Isolated AST up with a NORMAL ALT: non-liver sources (do not compute a liver ratio here)","causes":[{"dx":"Rhabdomyolysis / muscle injury","hook":"AST (and ALT) leak from skeletal muscle; CK markedly elevated and urine myoglobin positive; strenuous exercise or myopathy can do this without liver disease"},{"dx":"Myocardial infarction / cardiac muscle","hook":"AST is in cardiac muscle (an obsolete cardiac marker); troponin is the actual test, but classic teaching links AST to MI"},{"dx":"Hemolysis","hook":"AST released from lysed RBCs; pair with high LDH, high indirect bilirubin, low haptoglobin"}]},{"label":"AST:ALT ratio \u003c1 (ALT predominant): most viral and metabolic liver disease","causes":[{"dx":"Acute viral hepatitis (A-E)","hook":"ALT usually > AST; risk factors plus hepatitis serologies; can exceed 1000 in acute disease"},{"dx":"NAFLD / NASH","hook":"most common cause of mild chronic transaminitis in the US; ALT>AST until cirrhosis develops; metabolic syndrome on the history"},{"dx":"Chronic viral hepatitis B or C","hook":"mild persistent ALT>AST elevation; ratio climbs toward and above 1 once cirrhosis sets in"}]},{"label":"Very high AST (>1000 U/L): the short, board-classic list","causes":[{"dx":"Ischemic (shock) hepatitis","hook":"hypotension / shock liver; AST and ALT in the thousands that rise and fall rapidly; LDH disproportionately high, so ALT:LDH ratio is low (\u003c1.5)"},{"dx":"Acetaminophen toxicity","hook":"massive transaminases; check acetaminophen level, plot on Rumack-Matthew nomogram, treat with N-acetylcysteine"},{"dx":"Acute viral hepatitis (severe)","hook":"ALT typically > AST; send viral hepatitis serologies"},{"dx":"Autoimmune hepatitis","hook":"young woman with other autoimmune disease; positive ANA / anti-smooth muscle Ab, high IgG"}]},{"label":"Other shelf-tested patterns","causes":[{"dx":"Wilson disease","hook":"young patient; board clue is ALP:total bilirubin ratio \u003c4 with Coombs-negative hemolysis; low ceruloplasmin, Kayser-Fleischer rings"},{"dx":"Drug-induced liver injury","hook":"statins, isoniazid, amiodarone, antiepileptics; review the medication list and timing of onset"},{"dx":"Right heart failure / congestive hepatopathy","hook":"passive congestion; mild AST/ALT rise with tender hepatomegaly and elevated JVP"}]}]},"low":{"heading":"Low AST","note":"A low AST is not clinically meaningful and is essentially never tested. The diagnostic value of AST lives entirely in elevation and in the AST:ALT ratio, not in low values.","groups":[{"label":"Rare / non-pathologic associations (not high-yield)","causes":[{"dx":"Vitamin B6 (pyridoxine) deficiency","hook":"B6 is a cofactor for AST and ALT, so deficiency can blunt levels; relevant mainly to why alcoholics make relatively less ALT, not as a low-AST diagnosis"},{"dx":"No workup indicated","hook":"a low AST in isolation requires no evaluation; do not invent pathology"}]}]},"pearls":["AST:ALT ratio is THE high-yield point. Ratio >2 (with AST rarely >300-500) suggests alcoholic hepatitis (A Scotch and Tonic = AST). Ratio \u003c1 (ALT>AST) fits viral hepatitis and NAFLD until cirrhosis develops, when the ratio flips to AST>ALT.","AST is NOT liver-specific. An isolated AST elevation with a NORMAL ALT should push you off the liver and toward non-liver sources: heart (MI, check troponin), skeletal muscle (rhabdo, check CK), and RBCs (hemolysis, check LDH/haptoglobin/indirect bilirubin). Do not compute an AST:ALT ratio in this setting.","Magnitude narrows the differential. >1000 U/L means ischemic (shock) liver, acetaminophen toxicity, or severe acute viral hepatitis. Shock liver classically has a low ALT:LDH ratio (\u003c1.5) because LDH is disproportionately high.","Best next test depends on the pattern: acetaminophen level plus NAC if toxic ingestion is suspected; hepatitis serologies for acute viral; right upper quadrant ultrasound for cholestatic or structural disease; AST:ALT ratio plus GGT to confirm an alcohol pattern.","Pseudo-elevation: a hemolyzed sample raises AST (and potassium) because both leak from lysed RBCs; redraw if hemolysis is flagged and the clinical picture does not fit liver disease.","Alcohol mechanism: ALT depends on pyridoxal-5'-phosphate (active vitamin B6) as a cofactor; chronic alcoholics are B6 deficient, so they make relatively less ALT, which is part of why the ratio runs AST>ALT."]},{"id":"alt","panel":"CMP","name":"Alanine Aminotransferase","abbr":"ALT","normalRange":"7-56 U/L","units":"U/L","high":{"heading":"Elevated ALT (hepatocellular injury)","note":"ALT is the more liver-specific transaminase. Elevation signals hepatocyte injury. Think in two axes: how high (mild/moderate vs >1000) and the AST:ALT ratio.","groups":[{"label":"Mild to moderate elevation (most common, chronic)","causes":[{"dx":"NAFLD / NASH","hook":"Most common cause of chronically elevated transaminases in the US; obese/metabolic syndrome patient with mildly high ALT > AST and a bright/echogenic (steatotic) liver on ultrasound"},{"dx":"Chronic viral hepatitis (B, C)","hook":"ALT > AST, often \u003c5x normal; next step is hepatitis serologies (HBsAg) and HCV antibody"},{"dx":"Hemochromatosis","hook":"Elevated transaminases plus high ferritin and transferrin saturation; screen when saturation >45 percent, confirm with HFE gene testing (C282Y); bronze skin, diabetes, arthralgias, cardiomyopathy"},{"dx":"Autoimmune hepatitis","hook":"Young woman, positive ANA / anti-smooth muscle antibody, high IgG; can flare to acute liver failure"},{"dx":"Wilson disease (board-classic young patient)","hook":"Age \u003c40, low ceruloplasmin, Kayser-Fleischer rings, neuropsychiatric signs; ranges from mild transaminitis to fulminant liver failure with hemolysis and a LOW alkaline phosphatase"},{"dx":"Alpha-1 antitrypsin deficiency","hook":"Unexplained liver disease plus early panacinar (basilar) emphysema in a younger nonsmoker; low serum A1AT"},{"dx":"Celiac disease","hook":"Unexplained mild transaminitis that resolves on a gluten-free diet; check tissue transglutaminase IgA"}]},{"label":"AST:ALT ratio shifts the differential","causes":[{"dx":"Alcoholic hepatitis","hook":"AST:ALT > 2:1 (the flip away from ALT predominance); AST and ALT usually \u003c300-500 even when very sick; GGT also elevated"},{"dx":"Viral / toxic hepatocellular injury","hook":"ALT > AST (ratio \u003c1); the typical pattern when injury is hepatocyte-driven and not alcohol"},{"dx":"Advanced fibrosis / cirrhosis (any cause)","hook":"AST:ALT can rise above 1 as fibrosis progresses, even in non-alcoholic disease (e.g. NAFLD progressing to NASH cirrhosis)"}]},{"label":"Markedly elevated (ALT >1000): think the big three","causes":[{"dx":"Acute viral hepatitis","hook":"Hepatitis A or B the classic culprits; ALT typically higher than AST, both in the thousands; jaundice, RUQ pain, viral prodrome"},{"dx":"Acetaminophen / drug toxicity","hook":"Massive transaminase rise; plot acetaminophen level on the Rumack-Matthew nomogram, give N-acetylcysteine; consider other hepatotoxins (e.g. amanita, isoniazid)"},{"dx":"Ischemic hepatitis (shock liver)","hook":"Hypotensive/critically ill patient; transaminases spike into the thousands then fall rapidly once perfusion is restored; LDH also very high (low ALT:LDH ratio)"},{"dx":"HSV hepatitis (can't-miss)","hook":"Pregnant or immunocompromised patient with fever and markedly elevated transaminases, often anicteric; empiric acyclovir is lifesaving"},{"dx":"Acute biliary obstruction (passing CBD stone)","hook":"Transient early ALT spike into the hundreds-to-thousands that falls quickly, BEFORE alkaline phosphatase climbs; classic shelf trick for choledocholithiasis"}]}]},"low":{"heading":"Low ALT","note":"Not clinically meaningful. A low ALT is essentially normal and is not part of any board differential. Do not invent pathology.","groups":[{"label":"Generally insignificant","causes":[{"dx":"Normal variant","hook":"Low values carry no diagnostic weight; only elevation is interpreted"},{"dx":"Vitamin B6 (pyridoxine) deficiency","hook":"ALT requires pyridoxal-5-phosphate (B6) as a cofactor, so deficiency can lower measured ALT; a trivia point, not a shelf answer"}]}]},"pearls":["AST:ALT ratio is the key discriminator. Ratio \u003c1 (ALT predominant) = viral hepatitis, NAFLD, most hepatocellular injury. Ratio >2 = alcohol (mnemonic: a Scotch and Tonic, AST > ALT for alcohol), most reliable when GGT is also up.","Alcoholic hepatitis rarely pushes AST/ALT above 500; if you see transaminases in the thousands, it is NOT alcohol. Think viral, acetaminophen, or ischemic (shock liver).","ALT >1000 differential is short: acute viral hepatitis, acetaminophen/toxin, ischemic hepatitis. LDH that is also sky-high (low ALT:LDH ratio) points to ischemic (shock) liver. Add HSV hepatitis in the pregnant or immunocompromised patient.","An AST:ALT ratio that creeps above 1 in known NAFLD suggests progression to advanced fibrosis or cirrhosis, not alcohol.","Pattern recognition: hepatocellular injury = AST/ALT up out of proportion to alkaline phosphatase. Cholestatic injury = alk phos and GGT up out of proportion to transaminases.","Most common cause of mild chronic elevation in the US is NAFLD; confirm with ultrasound and address metabolic syndrome.","Best next test for unexplained transaminitis: hepatitis B (HBsAg) and C (anti-HCV) serologies plus a right upper quadrant ultrasound; broaden to iron studies, ANA/anti-smooth muscle antibody and IgG, ceruloplasmin (if \u003c40), and alpha-1 antitrypsin when those are negative."]}];

const PANELS = [
  { id: 'CBC', label: 'CBC' },
  { id: 'CMP', label: 'CMP' },
];

let activePanel = 'CBC';
let searchTerm = '';

const tabsEl = document.getElementById('tabs');
const tbody = document.getElementById('tbody');
const searchEl = document.getElementById('search');
const emptyEl = document.getElementById('empty');
const overlay = document.getElementById('overlay');
const modalTitle = document.getElementById('modal-title');
const modalMeta = document.getElementById('modal-meta');
const modalBody = document.getElementById('modal-body');
const closeBtn = document.getElementById('close-btn');
const byId = Object.fromEntries(LABS.map(l => [l.id, l]));
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])); }

// Tabs
PANELS.forEach(p => {
  const btn = document.createElement('button');
  btn.className = 'tab' + (p.id === activePanel ? ' active' : '');
  btn.textContent = p.label;
  btn.dataset.id = p.id;
  btn.addEventListener('click', () => {
    activePanel = p.id;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.id === activePanel));
    render();
  });
  tabsEl.appendChild(btn);
});

// Rows
LABS.forEach(l => {
  const tr = document.createElement('tr');
  tr.className = 'panel-' + l.panel;
  tr.dataset.panel = l.panel;
  tr.dataset.search = (l.name + ' ' + l.abbr).toLowerCase();
  tr.tabIndex = 0;
  tr.setAttribute('role', 'button');
  tr.setAttribute('aria-label', l.name + ', open differential');
  tr.innerHTML =
    '<td class="lab">' + esc(l.name) + '<span class="abbr">' + esc(l.abbr) + '</span></td>' +
    '<td class="range">' + esc(l.normalRange) + '</td>' +
    '<td class="dirs">' +
      '<button class="dir-chip high" data-side="high" tabindex="-1">&uarr; High</button>' +
      '<button class="dir-chip low" data-side="low" tabindex="-1">&darr; Low</button>' +
    '</td>';
  tr.addEventListener('click', e => {
    const chip = e.target.closest('.dir-chip');
    openModal(l.id, chip ? chip.dataset.side : null);
  });
  tr.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(l.id, null); }
  });
  tbody.appendChild(tr);
});

searchEl.addEventListener('input', e => { searchTerm = e.target.value.trim().toLowerCase(); render(); });

function render() {
  let visible = 0;
  const searching = searchTerm.length > 0;
  tbody.querySelectorAll('tr').forEach(tr => {
    const panelMatch = searching || tr.dataset.panel === activePanel;
    const textMatch = !searching || tr.dataset.search.includes(searchTerm);
    const show = panelMatch && textMatch;
    tr.classList.toggle('hidden', !show);
    if (show) visible++;
  });
  emptyEl.classList.toggle('hidden', visible > 0);
  document.querySelectorAll('.tab').forEach(t => t.style.opacity = searching ? '0.4' : '');
}

function sideHtml(side, kind) {
  const arrow = kind === 'high' ? '&uarr;' : '&darr;';
  let html = '<div class="side ' + kind + '" data-side="' + kind + '">';
  html += '<div class="side-head"><span class="arrow">' + arrow + '</span><span class="heading">' + esc(side.heading) + '</span></div>';
  if (side.note) html += '<div class="side-note">' + esc(side.note) + '</div>';
  side.groups.forEach(g => {
    html += '<div class="group"><div class="group-label">' + esc(g.label) + '</div>';
    g.causes.forEach(c => {
      html += '<div class="cause"><span class="dx">' + esc(c.dx) + '</span><span class="hook">' + esc(c.hook) + '</span></div>';
    });
    html += '</div>';
  });
  html += '</div>';
  return html;
}

let lastFocused = null;

function openModal(id, focusSide) {
  const l = byId[id];
  if (!l) return;
  lastFocused = document.activeElement;
  modalTitle.innerHTML = esc(l.name) + '<span class="abbr">' + esc(l.abbr) + '</span>';
  modalMeta.innerHTML =
    '<span class="panel-chip ' + l.panel + '">' + l.panel + '</span>' +
    '<span class="range-pill"><span class="lbl">normal</span> ' + esc(l.normalRange) + '</span>';

  let body = '<div class="grid">' + sideHtml(l.high, 'high') + sideHtml(l.low, 'low') + '</div>';
  if (l.pearls && l.pearls.length) {
    body += '<div class="pearls"><h3>Pattern Pearls</h3><ul>' +
      l.pearls.map(p => '<li>' + esc(p) + '</li>').join('') + '</ul></div>';
  }
  modalBody.innerHTML = body;

  // Emphasize one side if a specific chip was clicked
  if (focusSide) {
    modalBody.querySelectorAll('.side').forEach(s => {
      s.classList.toggle('dim', s.dataset.side !== focusSide);
    });
  }

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  closeBtn.focus();
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  if (lastFocused) lastFocused.focus();
}

closeBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal(); });

render();
</script>
</body>
</html>
