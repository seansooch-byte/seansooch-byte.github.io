<html lang="en">

<title>CBC + CMP Decoder | Sean Sooch</title>

<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-hi: #1c2230;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --amber: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --cyan: #39d0d8;
    --high: #f85149;
    --high-bg: rgba(248, 81, 73, 0.08);
    --low: #58a6ff;
    --low-bg: rgba(88, 166, 255, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  h1, h2, h3 { font-family: 'Lexend', -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: -0.01em; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    padding: 2.5rem 1.25rem 4rem;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  header {
    text-align: center;
    margin-bottom: 1.75rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: clamp(1.75rem, 4vw, 2.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  header p {
    color: var(--text-dim);
    font-size: 0.95rem;
    margin-top: 0.5rem;
    font-style: italic;
  }
  .controls { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
  .search {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    color: var(--text);
    font-size: 1rem;
    font-family: inherit;
  }
  .search:focus { outline: none; border-color: var(--accent); }
  .tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .tab {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 1.1rem;
    color: var(--text-dim);
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab:hover { background: var(--panel-hi); color: var(--text); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600; }

  .table-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  thead th {
    text-align: left;
    padding: 0.85rem 1rem;
    background: var(--panel-hi);
    border-bottom: 1px solid var(--border);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    font-weight: 600;
  }
  thead th.dirs-h { text-align: right; }
  tbody tr {
    border-bottom: 1px solid var(--border);
    border-left: 3px solid transparent;
    transition: background 0.1s;
    cursor: pointer;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--panel-hi); }
  tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  tbody tr.panel-CBC { border-left-color: var(--red); }
  tbody tr.panel-CMP { border-left-color: var(--accent); }
  tbody td { padding: 0.7rem 1rem; vertical-align: middle; }
  td.lab { font-weight: 600; min-width: 150px; }
  td.lab .abbr { color: var(--text-dim); font-family: ui-monospace, monospace; font-size: 0.78rem; font-weight: 400; margin-left: 0.5rem; }
  td.range { font-family: ui-monospace, monospace; font-size: 0.82rem; color: var(--text-dim); white-space: nowrap; }
  td.dirs { text-align: right; white-space: nowrap; }
  .dir-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.2rem;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.22rem 0.55rem;
    border-radius: 5px;
    margin-left: 0.35rem;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.12s;
    font-family: inherit;
  }
  .dir-chip.high { color: var(--high); background: var(--high-bg); border-color: rgba(248,81,73,0.25); }
  .dir-chip.high:hover { background: rgba(248,81,73,0.18); }
  .dir-chip.low { color: var(--low); background: var(--low-bg); border-color: rgba(88,166,255,0.25); }
  .dir-chip.low:hover { background: rgba(88,166,255,0.18); }
  .empty { padding: 2rem; text-align: center; color: var(--text-dim); font-style: italic; }
  .hidden { display: none !important; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(1, 4, 9, 0.72);
    backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    padding: 1.25rem;
    z-index: 50;
    opacity: 0; pointer-events: none;
    transition: opacity 0.18s;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%; max-width: 880px;
    max-height: 88vh;
    display: flex; flex-direction: column;
    box-shadow: 0 24px 60px rgba(0,0,0,0.55);
    transform: translateY(8px) scale(0.99);
    transition: transform 0.18s;
  }
  .overlay.open .modal { transform: none; }
  .modal-head {
    display: flex; align-items: flex-start; gap: 1rem;
    padding: 1.25rem 1.4rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  .modal-head .titles { flex: 1; min-width: 0; }
  .modal-head h2 { font-size: 1.35rem; font-weight: 700; }
  .modal-head h2 .abbr { color: var(--text-dim); font-family: ui-monospace, monospace; font-size: 0.95rem; font-weight: 400; margin-left: 0.5rem; }
  .modal-head .meta-line { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-top: 0.45rem; }
  .panel-chip { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 4px; }
  .panel-chip.CBC { background: var(--red); color: #0d1117; }
  .panel-chip.CMP { background: var(--accent); color: #0d1117; }
  .range-pill { font-family: ui-monospace, monospace; font-size: 0.8rem; color: var(--text); background: var(--panel-hi); border: 1px solid var(--border); padding: 0.2rem 0.55rem; border-radius: 5px; }
  .range-pill .lbl { color: var(--text-dim); }
  .close-btn {
    flex-shrink: 0;
    background: var(--panel-hi); border: 1px solid var(--border); color: var(--text-dim);
    width: 34px; height: 34px; border-radius: 8px; font-size: 1.2rem; line-height: 1; cursor: pointer;
    transition: all 0.12s;
  }
  .close-btn:hover { color: var(--text); border-color: var(--text-dim); }

  .modal-body { overflow-y: auto; padding: 1.25rem 1.4rem 1.5rem; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .side { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; transition: opacity 0.15s; }
  .side.dim { opacity: 0.32; }
  .side-head { padding: 0.7rem 0.9rem; font-weight: 700; display: flex; align-items: baseline; gap: 0.5rem; }
  .side.high .side-head { background: var(--high-bg); color: var(--high); border-bottom: 1px solid rgba(248,81,73,0.25); }
  .side.low .side-head { background: var(--low-bg); color: var(--low); border-bottom: 1px solid rgba(88,166,255,0.25); }
  .side-head .arrow { font-size: 1.05rem; }
  .side-head .heading { font-size: 1rem; }
  .side-note { padding: 0.6rem 0.9rem 0; color: var(--text-dim); font-size: 0.82rem; font-style: italic; }
  .group { padding: 0.65rem 0.9rem 0.2rem; }
  .group-label {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700;
    color: var(--text-dim); margin-bottom: 0.45rem; padding-bottom: 0.3rem; border-bottom: 1px dashed var(--border);
  }
  .cause { margin-bottom: 0.55rem; }
  .cause .dx { font-weight: 600; font-size: 0.9rem; }
  .cause .hook { color: var(--text-dim); font-size: 0.82rem; display: block; margin-top: 0.1rem; }
  .side.high .cause .hook::before { content: "▸ "; color: var(--high); }
  .side.low .cause .hook::before { content: "▸ "; color: var(--low); }

  .pearls { margin-top: 1.1rem; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-hi); padding: 0.85rem 1rem; }
  .pearls h3 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--amber); margin-bottom: 0.55rem; }
  .pearls ul { list-style: none; }
  .pearls li { font-size: 0.86rem; padding-left: 1.2rem; position: relative; margin-bottom: 0.4rem; color: var(--text); }
  .pearls li:last-child { margin-bottom: 0; }
  .pearls li::before { content: "◆"; color: var(--amber); position: absolute; left: 0; font-size: 0.7rem; top: 0.18rem; }

  footer { text-align: center; margin-top: 2.5rem; color: var(--text-dim); font-size: 0.8rem; }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 640px) {
    td.range { display: none; }
    thead th.range-h { display: none; }
    .grid { grid-template-columns: 1fr; }
    .side.dim { opacity: 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CBC + CMP Decoder</h1>
    <p>Click a value. See what a high or low result is trying to tell you.</p>
  </header>

  <div class="controls">
    <input type="text" class="search" id="search" placeholder="Search a lab (e.g. potassium, MCV, AST)">
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Lab</th>
          <th class="range-h">Reference Range</th>
          <th class="dirs-h">Study</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty hidden" id="empty">No labs match your search.</div>
  </div>

  <footer>
    <p>High-yield differentials for the Internal Medicine shelf and Step 2 CK. Educational use only, not a substitute for clinical judgment.</p>
    <p style="margin-top:0.4rem;"><a href="../">&larr; Back to Lab Values</a></p>
  </footer>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div class="titles">
        <h2 id="modal-title"></h2>
        <div class="meta-line" id="modal-meta"></div>
      </div>
      <button class="close-btn" id="close-btn" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const LABS = [{"id":"wbc","panel":"CBC","name":"White Blood Cells","abbr":"WBC","normalRange":"4,500-11,000 /µL","units":"/µL","high":{"heading":"Leukocytosis (WBC > 11,000)","note":"Always work the differential count, not just the total. The dominant cell line points to the cause: neutrophils = bacterial/inflammation/steroids, lymphocytes = viral/CLL, eosinophils = NAACP, basophils = think CML.","groups":[{"label":"Neutrophilic (infection / inflammation)","causes":[{"dx":"Acute bacterial infection","hook":"Neutrophilia with left shift (bands, immature forms); toxic granulation and Dohle bodies on smear"},{"dx":"Tissue inflammation / necrosis","hook":"MI, burns, pancreatitis, infarct, post-op all drive neutrophilia without infection"},{"dx":"Leukemoid reaction","hook":"WBC > 50,000 from severe infection; HIGH LAP score (leukocyte alkaline phosphatase) distinguishes it from CML"}]},{"label":"Demargination (steroid / stress / catecholamine)","causes":[{"dx":"Corticosteroids","hook":"Neutrophilia from demargination plus blocked egress to tissue; paradoxically lymphopenia and eosinopenia"},{"dx":"Acute stress / catecholamines","hook":"Exercise, pain, epinephrine shift the marginated pool into circulation; transient and quick"},{"dx":"Splenectomy / asplenia","hook":"Leukocytosis plus Howell-Jolly bodies, target cells, thrombocytosis on smear"}]},{"label":"Lymphocytic","causes":[{"dx":"Viral infection","hook":"Lymphocyte-predominant; EBV mono gives atypical (Downey) lymphocytes and positive Monospot"},{"dx":"Pertussis","hook":"Striking lymphocytosis with a paroxysmal cough in an infant"},{"dx":"CLL","hook":"Older adult, marked mature lymphocytosis, smudge cells on smear; most common adult leukemia in the West"}]},{"label":"Myeloid malignancy","causes":[{"dx":"CML","hook":"Massive neutrophilia with basophilia, LOW LAP score, t(9;22) Philadelphia/BCR-ABL; whole myeloid spectrum on smear"},{"dx":"AML","hook":"Myeloblasts with Auer rods; very high blast counts (often > 50,000-100,000) cause leukostasis (dyspnea, AMS): a medical emergency"}]},{"label":"Lymphoid malignancy","causes":[{"dx":"ALL","hook":"Child with lymphoblasts, TdT positive; most common childhood leukemia (and childhood cancer overall)"},{"dx":"CLL","hook":"See lymphocytic group above: malignant clone of mature B lymphocytes; smudge cells; the chronic lymphoid leukemia of older adults"}]},{"label":"Eosinophilic / basophilic","causes":[{"dx":"Eosinophilia (NAACP)","hook":"Neoplasm, Allergy/Asthma, Adrenal insufficiency (Addison), Collagen vascular disease, Parasites (invasive helminths)"},{"dx":"Basophilia","hook":"Think CML and other myeloproliferative neoplasms until proven otherwise"}]}]},"low":{"heading":"Leukopenia (WBC \u003c 4,500)","note":"Clinically meaningful: neutropenia is what raises infection risk. Calculate the ANC; ANC \u003c 500 is severe and warrants neutropenic precautions. Sort the cause into decreased production vs increased destruction/sequestration.","groups":[{"label":"Decreased production","causes":[{"dx":"Marrow suppression (chemo / radiation)","hook":"Most common cause; nadir typically 7-14 days after cytotoxic chemo"},{"dx":"Aplastic anemia","hook":"Pancytopenia with a hypocellular, fatty marrow; consider drugs, viruses, benzene"},{"dx":"Marrow infiltration","hook":"Leukemia, lymphoma, or mets crowd out normal lines; leukoerythroblastic smear with teardrop cells"},{"dx":"B12 / folate deficiency","hook":"Megaloblastic change: hypersegmented neutrophils, pancytopenia in severe cases"}]},{"label":"Increased destruction / sequestration","causes":[{"dx":"Hypersplenism","hook":"Splenic pooling drops all lines; cirrhosis/portal hypertension with splenomegaly"},{"dx":"Autoimmune (SLE)","hook":"Leukopenia (especially lymphopenia) is a classic SLE lab criterion"},{"dx":"Sepsis (overwhelming)","hook":"Severe infection can consume neutrophils faster than marrow replaces them; ominous sign"}]},{"label":"Drug / infection-induced","causes":[{"dx":"Drug-induced agranulocytosis","hook":"Classic offenders: clozapine, methimazole/PTU, carbamazepine, sulfonamides, ticlopidine"},{"dx":"Viral suppression","hook":"HIV, EBV, CMV, hepatitis cause transient marrow suppression / lymphopenia"}]}]},"pearls":["Always interpret the WBC with the differential. A normal total WBC can hide a dangerous neutropenia if lymphocytes are high, and vice versa.","ANC = total WBC x (% segs + % bands) / 100. ANC \u003c 1,500 = neutropenia, \u003c 500 = severe (high infection risk, start neutropenic precautions / consider G-CSF).","NEUTROPENIC FEVER is the can't-miss emergency: fever (single temp >= 38.3 C or >= 38.0 C sustained) plus ANC \u003c 500. Start empiric broad-spectrum antibiotics (e.g., cefepime) IMMEDIATELY, before identifying a source; do not wait for cultures.","Leukemoid reaction vs CML: both show very high neutrophil counts, but LAP score is HIGH in leukemoid reaction (reactive) and LOW in CML. CML also has basophilia and BCR-ABL / Philadelphia chromosome.","Left shift = increased bands and immature granulocytes, signaling demand for neutrophils (infection, inflammation); not specific for malignancy.","Steroids cause neutrophilia (demargination + reduced tissue egress) but lymphopenia and eosinopenia at the same time.","Eosinophilia mnemonic NAACP: Neoplasm, Allergy/Asthma, Adrenal insufficiency, Collagen vascular disease, Parasites.","Basophilia or unexplained marked neutrophilia with basophilia: think CML / myeloproliferative neoplasm.","Very high blast counts (AML, ALL) can cause leukostasis (dyspnea, visual changes, AMS): a hematologic emergency needing urgent cytoreduction.","Single best next test for unexplained leukocytosis or leukopenia: review the peripheral smear; a marrow biopsy is the definitive step if a primary hematologic process is suspected."]},{"id":"hgb","panel":"CBC","name":"Hemoglobin","abbr":"Hgb","normalRange":"Male 13.5-17.5, Female 12.0-15.5 g/dL","units":"g/dL","high":{"heading":"Elevated Hgb (Polycythemia / Erythrocytosis)","note":"First split: is the red cell mass truly increased (absolute), or is plasma volume just down (relative)? Then within absolute, check EPO and JAK2.","groups":[{"label":"Relative (plasma volume contracted, red cell mass normal)","causes":[{"dx":"Dehydration / volume depletion","hook":"Hemoconcentration: Hgb and Hct rise together with BUN:Cr >20; corrects with fluids"},{"dx":"Gaisbock syndrome (stress / spurious erythrocytosis)","hook":"Middle-aged HTN smoker, normal RBC mass, high-normal Hct; relative not absolute"}]},{"label":"Absolute, EPO low (primary marrow problem)","causes":[{"dx":"Polycythemia vera","hook":"JAK2 V617F mutation, LOW EPO, often high platelets and WBC, splenomegaly, aquagenic pruritus after hot shower; treat with phlebotomy"}]},{"label":"Absolute, EPO high (secondary, hypoxia-driven)","causes":[{"dx":"COPD / chronic hypoxemia","hook":"Chronic hypoxia drives EPO; appropriate secondary polycythemia"},{"dx":"Obstructive sleep apnea / obesity hypoventilation","hook":"Nocturnal desaturation, morning headaches, elevated Hct on CBC"},{"dx":"High-altitude residence","hook":"Physiologic appropriate EPO rise from low ambient O2"},{"dx":"Cyanotic congenital heart disease (R-to-L shunt)","hook":"Chronic hypoxemia from shunting, clubbing, low SaO2"},{"dx":"Carboxyhemoglobinemia (heavy smoking / CO)","hook":"CO shifts O2 curve, smoker polycythemia, falsely normal pulse ox"}]},{"label":"Absolute, EPO high (inappropriate, tumor-secreted)","causes":[{"dx":"Renal cell carcinoma","hook":"Paraneoplastic EPO; hematuria + flank mass + polycythemia triad"},{"dx":"Hepatocellular carcinoma","hook":"Ectopic EPO in cirrhotic with rising AFP"},{"dx":"Cerebellar hemangioblastoma (VHL)","hook":"EPO-secreting CNS tumor, think von Hippel-Lindau"},{"dx":"Exogenous EPO / androgen (testosterone) use","hook":"Athlete or hypogonadism therapy, high EPO from injection, suppressed in androgen case"}]}]},"low":{"heading":"Low Hgb (Anemia)","note":"The whole workup pivots on the MCV row: micro (\u003c80), normo (80-100), macro (>100). Reticulocyte count is the very first branch: high retic = blood loss or hemolysis (marrow responding), low retic = underproduction.","groups":[{"label":"Microcytic (MCV \u003c80): mnemonic TICS","causes":[{"dx":"Iron deficiency anemia","hook":"Low ferritin (best test), high TIBC, low transferrin sat; in adult male or postmenopausal woman think GI blood loss, scope them"},{"dx":"Anemia of chronic disease (can be micro or normo)","hook":"HIGH ferritin, LOW TIBC, high hepcidin traps iron in macrophages"},{"dx":"Thalassemia","hook":"Very low MCV out of proportion to mild anemia, normal/high RBC count, target cells; Mentzer index \u003c13; Hgb electrophoresis (high HbA2 in beta)"},{"dx":"Sideroblastic anemia / lead poisoning","hook":"Basophilic stippling, ringed sideroblasts, high iron with high ferritin; lead in kids with pica"}]},{"label":"Normocytic, HIGH reticulocyte (loss or destruction)","causes":[{"dx":"Acute blood loss","hook":"Hgb can be normal early before plasma re-equilibrates; retic up in 2-3 days"},{"dx":"Hemolysis, general","hook":"High LDH, high indirect bilirubin, LOW haptoglobin, high retic; Coombs splits immune vs non-immune"},{"dx":"Autoimmune hemolytic anemia","hook":"Positive direct Coombs; warm IgG (spherocytes, SLE/CLL) vs cold IgM (Mycoplasma, mono)"},{"dx":"Sickle cell disease","hook":"Sickled cells, Howell-Jolly bodies (autosplenectomy), vaso-occlusive pain crises"},{"dx":"G6PD deficiency","hook":"Bite cells, Heinz bodies after oxidant stress (dapsone, fava beans, infection)"},{"dx":"Hereditary spherocytosis","hook":"Spherocytes, high MCHC, positive osmotic fragility / EMA binding, splenomegaly"},{"dx":"Microangiopathic (TTP/HUS, DIC)","hook":"Schistocytes on smear; TTP pentad, HUS after EHEC O157:H7, DIC with low fibrinogen and high D-dimer"}]},{"label":"Normocytic, LOW reticulocyte (underproduction)","causes":[{"dx":"Anemia of chronic disease / inflammation","hook":"Most common normocytic anemia, high ferritin, low TIBC, blunted retic"},{"dx":"Anemia of chronic kidney disease","hook":"Low EPO from failing kidneys; treat with EPO once iron repleted"},{"dx":"Aplastic anemia","hook":"Pancytopenia with low retic, hypocellular dry-tap marrow; drugs, parvovirus, benzene"},{"dx":"Pure red cell aplasia (parvovirus B19)","hook":"Isolated anemia in sickle cell or immunocompromised, absent retic"}]},{"label":"Macrocytic (MCV >100)","causes":[{"dx":"B12 deficiency (megaloblastic)","hook":"Hypersegmented neutrophils, glossitis, NEURO findings (subacute combined degeneration); pernicious anemia, ileal disease, vegan"},{"dx":"Folate deficiency (megaloblastic)","hook":"Same smear as B12 but NO neuro signs; alcoholics, pregnancy, methotrexate/trimethoprim; check B12 first before repleting folate"},{"dx":"Alcohol / liver disease (non-megaloblastic)","hook":"Round macrocytes, target cells, NO hypersegmentation"},{"dx":"Myelodysplastic syndrome","hook":"Older patient, macrocytosis with cytopenias, pseudo-Pelger-Huet cells, dysplasia"},{"dx":"Drugs / reticulocytosis","hook":"Hydroxyurea, AZT; brisk retic count raises MCV because retics are large"}]}]},"pearls":["Reticulocyte count is the first fork in any anemia: corrected retic / retic index >2-3 percent means appropriate marrow response (blood loss or hemolysis); \u003c2 percent means underproduction.","MCV is the organizing axis: micro \u003c80, normo 80-100, macro >100. Build the differential off the MCV row first.","Hemolysis lab panel: high LDH + high indirect bilirubin + LOW haptoglobin + high retic. Then send direct Coombs to split immune vs non-immune.","Iron studies decode the microcytics: IDA = low ferritin, high TIBC; ACD = high ferritin, low TIBC. Ferritin is the single best test for iron deficiency (it is also an acute phase reactant, so high ferritin does not rule it out during inflammation).","Mentzer index (MCV / RBC count): >13 favors iron deficiency, \u003c13 favors thalassemia (thal makes lots of small cells, so RBC count stays high).","New iron deficiency anemia in an adult male or postmenopausal female is GI blood loss until proven otherwise: get colonoscopy / EGD.","Always check B12 before giving folate in macrocytic anemia: folate corrects the anemia but lets B12 neuropathy progress.","Spurious / pseudo causes: Hgb and Hct track plasma volume, so dehydration falsely raises them (relative polycythemia) and over-resuscitation / pregnancy dilution falsely lowers them (dilutional anemia). Check the clinical volume status.","For elevated Hgb the single most useful branch point is serum EPO: LOW EPO points to polycythemia vera (then send JAK2 V617F); HIGH EPO points to a secondary hypoxic or tumor cause.","Pulse ox can be falsely normal in CO poisoning (carboxyhemoglobin) and in methemoglobinemia: when SaO2 does not fit the picture, get a co-oximetry / ABG."]},{"id":"hct","panel":"CBC","name":"Hematocrit","abbr":"Hct","normalRange":"Male 41-53%, Female 36-46%","units":"% (volume fraction of RBCs)","high":{"heading":"Elevated Hematocrit (Erythrocytosis / Polycythemia)","note":"Hct tracks with Hgb (roughly 3x Hgb), so the differential mirrors hemoglobin. First split into relative (plasma loss, normal RBC mass) vs absolute (true increase in RBC mass), then split absolute into primary vs secondary.","groups":[{"label":"Relative / spurious (plasma volume down, RBC mass normal)","causes":[{"dx":"Dehydration / hemoconcentration","hook":"Most common shelf cause of a high Hct; vomiting, diarrhea, diuretics, burns. Corrects with fluids"},{"dx":"Gaisbock syndrome (stress/relative polycythemia)","hook":"Middle-aged HTN smoker, elevated Hct with normal RBC mass; plasma contraction"}]},{"label":"Absolute, primary (low EPO)","causes":[{"dx":"Polycythemia vera","hook":"JAK2 V617F mutation, LOW EPO; pruritus after hot shower (aquagenic), erythromelalgia, splenomegaly, high platelets/WBC. Tx: phlebotomy + hydroxyurea + aspirin"}]},{"label":"Absolute, secondary (high EPO, appropriate hypoxia-driven)","causes":[{"dx":"Chronic hypoxia (COPD, OSA, high altitude, cyanotic heart disease)","hook":"Appropriate EPO rise to chronic hypoxemia; hypoxia is the stimulus"},{"dx":"Chronic carbon monoxide exposure (heavy smoking)","hook":"Carboxyhemoglobin shifts O2 curve left, tissue hypoxia drives EPO; smoker's polycythemia"}]},{"label":"Absolute, secondary (high EPO, inappropriate / tumor)","causes":[{"dx":"Renal cell carcinoma","hook":"Classic paraneoplastic EPO; high Hct + flank mass + hematuria"},{"dx":"Hepatocellular carcinoma","hook":"Ectopic EPO production"},{"dx":"Cerebellar hemangioblastoma","hook":"EPO-secreting CNS tumor; think von Hippel-Lindau"},{"dx":"Exogenous EPO / androgen / testosterone use","hook":"Athlete doping or supraphysiologic testosterone replacement; iatrogenic erythrocytosis"}]}]},"low":{"heading":"Low Hematocrit (Anemia)","note":"Low Hct = anemia; same buckets as hemoglobin. The shelf workup is driven by the MCV: microcytic vs normocytic vs macrocytic. Always think about whether the value is truly low or dilutional.","groups":[{"label":"Dilutional (RBC mass normal, plasma volume up)","causes":[{"dx":"Volume overload / aggressive IV fluids","hook":"Hemodilution drops Hct without true RBC loss"},{"dx":"Pregnancy","hook":"Physiologic dilutional anemia; plasma volume expands more than RBC mass"}]},{"label":"Microcytic (MCV \u003c 80)","causes":[{"dx":"Iron deficiency anemia","hook":"Low ferritin, high TIBC, low transferrin sat; in older adults assume GI blood loss until proven otherwise"},{"dx":"Anemia of chronic disease","hook":"High ferritin, low TIBC, high hepcidin; usually normocytic but can be microcytic"},{"dx":"Thalassemia","hook":"Normal/high RBC count with very low MCV, normal ferritin; confirm with Hgb electrophoresis"},{"dx":"Sideroblastic anemia / lead poisoning","hook":"Ringed sideroblasts, basophilic stippling; lead in kids with pica"}]},{"label":"Normocytic (MCV 80-100): check reticulocyte count","causes":[{"dx":"Acute blood loss / hemorrhage","hook":"High retic count; Hct may lag until plasma re-equilibrates over hours"},{"dx":"Hemolysis","hook":"High retic, high LDH, high indirect bilirubin, low haptoglobin; check Coombs and smear (schistocytes vs spherocytes)"},{"dx":"Anemia of chronic kidney disease","hook":"Low EPO; low retic; treat with EPO once iron repleted"},{"dx":"Aplastic anemia / marrow infiltration","hook":"Low retic with pancytopenia; dry tap or hypocellular marrow"}]},{"label":"Macrocytic (MCV > 100)","causes":[{"dx":"B12 deficiency","hook":"Hypersegmented neutrophils, glossitis, neuro deficits (subacute combined degeneration); high methylmalonic acid"},{"dx":"Folate deficiency","hook":"Megaloblastic with NO neuro signs; alcoholism, pregnancy, methotrexate"},{"dx":"Alcohol / liver disease / hypothyroidism","hook":"Non-megaloblastic macrocytosis; no hypersegmentation"}]}]},"pearls":["Rule of three: Hct is roughly 3x the Hgb (and Hgb is roughly 3x the RBC count). A Hgb of 15 predicts an Hct of about 45; a big mismatch suggests a lab error or in-vivo agglutination.","Hct is a calculated/derived value on most analyzers (MCV x RBC count), so it can be spuriously affected: cold agglutinins and severe hyperglycemia can falsely alter it.","Always distinguish RELATIVE from ABSOLUTE before chasing pathology: dehydration raises Hct and overhydration/pregnancy lowers it with a normal underlying RBC mass.","Acute hemorrhage does NOT immediately drop the Hct: whole blood is lost isotonically, so Hct falls only after fluid shifts or IV fluids dilute the remaining cells (hours later).","First branch point for a low Hct is the MCV; first branch point for a high Hct is the EPO level (low EPO = polycythemia vera, high EPO = secondary).","Next best test for unexplained polycythemia: serum EPO, then JAK2 V617F if EPO is low.","Polycythemia vera is the one high-Hct cause with a LOW EPO; everything else secondary has a high or inappropriately normal EPO."]},{"id":"mcv","panel":"CBC","name":"Mean Corpuscular Volume","abbr":"MCV","normalRange":"80-100 fL","units":"fL (femtoliters)","high":{"heading":"High MCV (Macrocytic Anemia, MCV >100)","note":"First split macrocytic anemia into megaloblastic (impaired DNA synthesis, hypersegmented neutrophils) vs non-megaloblastic. The peripheral smear plus B12/folate level are your pivot. Remember MCV can be high without anemia (alcohol, hypothyroidism).","groups":[{"label":"Megaloblastic (impaired DNA synthesis, hypersegmented neutrophils)","causes":[{"dx":"Vitamin B12 (cobalamin) deficiency","hook":"Hypersegmented PMNs + neuro signs (subacute combined degeneration: dorsal columns and lateral corticospinal tracts, paresthesias, loss of proprioception/vibration). HIGH methylmalonic acid AND HIGH homocysteine"},{"dx":"Folate deficiency","hook":"Same megaloblastic smear but NO neuro signs. HIGH homocysteine, NORMAL methylmalonic acid. Think alcoholic, pregnancy, methotrexate, goat-milk diet"},{"dx":"Pernicious anemia","hook":"Anti-intrinsic factor / anti-parietal cell antibodies; autoimmune atrophic gastritis; the classic shelf cause of B12 deficiency. Increased gastric cancer risk"},{"dx":"Drugs impairing folate/DNA synthesis","hook":"Methotrexate, trimethoprim, phenytoin (folate), AZT/zidovudine, hydroxyurea, 5-FU. 'Drug-induced megaloblastic change'"}]},{"label":"Non-megaloblastic (normal DNA synthesis, no hypersegmentation)","causes":[{"dx":"Alcohol / chronic alcohol use","hook":"Direct marrow toxicity; classic cause of macrocytosis often WITHOUT anemia and with normal B12/folate. Round (not oval) macrocytes"},{"dx":"Liver disease","hook":"Excess lipid on the RBC membrane; target cells, round macrocytes. Often with elevated GGT, low albumin, abnormal LFTs"},{"dx":"Hypothyroidism","hook":"Mild macrocytosis, may be without anemia; check TSH. Slows erythroid maturation"},{"dx":"Myelodysplastic syndrome (MDS)","hook":"Older patient, cytopenias/pancytopenia, macro-ovalocytes, ring sideroblasts, pseudo-Pelger-Huet (bilobed) neutrophils; risk of transformation to AML"},{"dx":"Reticulocytosis","hook":"Hemolysis or recent blood loss; reticulocytes are genuinely large cells, so this is a TRUE macrocytosis, not artifact. HIGH reticulocyte count, polychromasia on smear"}]}]},"low":{"heading":"Low MCV (Microcytic Anemia, MCV \u003c80)","note":"Mnemonic TICS: Thalassemia, Iron deficiency, Chronic disease (when severe/late), Sideroblastic (incl. lead). Use RDW and the Mentzer index to separate iron deficiency from thalassemia.","groups":[{"label":"TICS (microcytic differential)","causes":[{"dx":"Iron deficiency anemia","hook":"LOW ferritin (best test), low serum iron, HIGH TIBC, HIGH RDW. Mentzer index >13. Pica, koilonychia. Most common cause of microcytic anemia overall"},{"dx":"Thalassemia (alpha/beta)","hook":"NORMAL RDW, target cells, RBC count often normal/high, MCV very low out of proportion to mild anemia. Mentzer index \u003c13. Hgb electrophoresis (beta-thal: HIGH HbA2)"},{"dx":"Anemia of chronic disease (late)","hook":"Usually normocytic, becomes microcytic only when severe. HIGH/normal ferritin, LOW iron, LOW TIBC, low transferrin saturation. Hepcidin traps iron in stores"},{"dx":"Sideroblastic anemia","hook":"Ring sideroblasts on Prussian blue stain; HIGH iron, ferritin, transferrin sat. Note acquired forms are often dimorphic or normo/macrocytic; hereditary (X-linked) and lead-related forms are the microcytic ones. Causes: lead, alcohol, isoniazid (B6 deficiency), congenital (copper deficiency is a rare mimic)"},{"dx":"Lead poisoning","hook":"Basophilic stippling, ring sideroblasts; child with pica/old paint, abdominal pain, neuro/cognitive deficits. Elevated venous blood lead level confirms"}]}]},"pearls":["Step 1 next test for ANY anemia: reticulocyte count (production problem vs destruction/loss), then bin by MCV into micro/normo/macro.","Mentzer index = MCV / RBC count. >13 favors iron deficiency; \u003c13 favors thalassemia (thalassemia makes many small cells, so the RBC count stays high).","RDW is the iron-vs-thalassemia tiebreaker: HIGH RDW (anisocytosis) = iron deficiency; NORMAL RDW = thalassemia.","Best single test for iron deficiency = ferritin (low). Iron studies: iron deficiency = low ferritin / low iron / HIGH TIBC; anemia of chronic disease = high-or-normal ferritin / low iron / LOW TIBC.","B12 vs folate tiebreaker: BOTH raise homocysteine, but only B12 deficiency raises methylmalonic acid (MMA). Neuro signs point to B12, not folate.","Always replace B12 before (or together with) folate: giving folate alone in B12 deficiency corrects the anemia but lets the neurologic damage (subacute combined degeneration) progress.","A mixed iron + B12/folate deficiency (or reticulocytosis with another process) can produce a NORMAL MCV by averaging micro and macro populations; a HIGH RDW or a dimorphic smear hints at the mixed picture.","MCV can be elevated (macrocytosis) WITHOUT anemia: classic for alcohol use and hypothyroidism.","Smear shortcuts: hypersegmented neutrophils = megaloblastic; target cells = thalassemia or liver disease; basophilic stippling = lead or sideroblastic; macro-ovalocytes + pseudo-Pelger-Huet = MDS."]},{"id":"plt","panel":"CBC","name":"Platelets","abbr":"Plt","normalRange":"150,000-400,000 /µL","units":"/µL","high":{"heading":"Thrombocytosis","note":"First split reactive (secondary, far more common) from clonal (primary MPN). Reactive thrombocytosis rarely causes thrombosis or bleeding; clonal can do both.","groups":[{"label":"Reactive / secondary (the common bucket)","causes":[{"dx":"Iron deficiency anemia","hook":"Microcytic anemia with HIGH platelets, the classic 'low Hgb, low MCV, high Plt' triad; treat the iron and platelets normalize"},{"dx":"Acute infection / inflammation","hook":"Acute-phase reactant: IL-6 driven, which upregulates hepatic thrombopoietin (TPO); resolves with the illness"},{"dx":"Chronic inflammation (RA, IBD, vasculitis)","hook":"Persistent IL-6 raises TPO; tracks with disease activity, anemia of chronic disease alongside"},{"dx":"Post-splenectomy / hyposplenism","hook":"Loss of splenic pooling; Howell-Jolly bodies on smear confirm asplenia, can be strikingly high and persistent"},{"dx":"Occult malignancy","hook":"Paraneoplastic thrombocytosis (esp. GI, lung, ovarian); unexplained high Plt in older adult warrants a malignancy workup"},{"dx":"Acute blood loss / post-surgery","hook":"Rebound thrombocytosis a few days after hemorrhage or major surgery"}]},{"label":"Clonal / primary (myeloproliferative)","causes":[{"dx":"Essential thrombocythemia (ET)","hook":"Sustained Plt often >450k up to >1 million; JAK2 V617F (~50-60%), CALR (~20-25%), or MPL (~3-5%) mutation; both thrombosis AND bleeding (acquired von Willebrand at extreme counts >1 million)"},{"dx":"Polycythemia vera","hook":"High Plt + high Hgb/Hct + low EPO + JAK2 V617F (~95%+, vs ~50% in ET); aquagenic pruritus, splenomegaly"},{"dx":"CML","hook":"Thrombocytosis with marked leukocytosis and left shift; Philadelphia chromosome / BCR-ABL, low LAP score"},{"dx":"Primary myelofibrosis","hook":"Teardrop cells (dacrocytes), leukoerythroblastic smear, massive splenomegaly; Plt may be high early then drop"}]}]},"low":{"heading":"Thrombocytopenia","note":"Frame by mechanism: decreased production, increased destruction/consumption, sequestration, or dilution. Always confirm with a smear first to exclude pseudothrombocytopenia (clumping) and to look for schistocytes.","groups":[{"label":"Decreased production (marrow problem)","causes":[{"dx":"Bone marrow failure / infiltration","hook":"Aplastic anemia, leukemia, myelofibrosis, metastatic infiltration; usually pancytopenia, not isolated low Plt"},{"dx":"Nutritional (B12 / folate deficiency)","hook":"Megaloblastic; hypersegmented neutrophils, macrocytosis, can drop all three lines"},{"dx":"Chemotherapy / radiation","hook":"Dose-dependent marrow suppression; nadir roughly 7-10 days post-chemo"},{"dx":"Alcohol / liver disease (marrow effect)","hook":"Direct marrow toxicity plus reduced thrombopoietin from the liver"}]},{"label":"Increased destruction: immune","causes":[{"dx":"Immune thrombocytopenia (ITP)","hook":"Isolated thrombocytopenia, otherwise normal CBC and smear; diagnosis of EXCLUSION; kids post-viral and self-limited, adults chronic; first-line steroids / IVIG"},{"dx":"Heparin-induced thrombocytopenia (HIT)","hook":"4Ts score; drop >50% at days 5-10 of heparin; anti-PF4 antibodies cause THROMBOSIS not bleeding; stop heparin, start a non-heparin anticoagulant (argatroban)"},{"dx":"Drug-induced immune","hook":"Quinine, sulfonamides, vancomycin, GPIIb/IIIa inhibitors; resolves after stopping the drug"},{"dx":"Secondary immune (SLE, HIV, HCV, CLL)","hook":"ITP-like picture driven by an underlying autoimmune or infectious process; check the company it keeps"}]},{"label":"Increased consumption: microangiopathic (MAHA, schistocytes)","causes":[{"dx":"Thrombotic thrombocytopenic purpura (TTP)","hook":"Pentad: thrombocytopenia, MAHA, neuro changes, renal, fever (rarely all 5); ADAMTS13 deficiency; NORMAL coags; treat with plasma exchange, do NOT give platelets"},{"dx":"Hemolytic uremic syndrome (HUS)","hook":"Triad: thrombocytopenia, MAHA, acute kidney injury; child with bloody diarrhea, Shiga-toxin E. coli O157:H7; renal-predominant"},{"dx":"Disseminated intravascular coagulation (DIC)","hook":"Consumes everything: low Plt, HIGH PT/PTT, HIGH D-dimer, LOW fibrinogen, schistocytes; secondary to sepsis, OB emergency, malignancy"},{"dx":"HELLP syndrome","hook":"Pregnancy: Hemolysis, Elevated Liver enzymes, Low Platelets; severe preeclampsia variant, delivery is definitive"}]},{"label":"Sequestration & dilution","causes":[{"dx":"Splenic sequestration","hook":"Splenomegaly from cirrhosis/portal HTN pools platelets; usually mild (rarely \u003c50k), often with low WBC too (hypersplenism)"},{"dx":"Cirrhosis / chronic liver disease","hook":"Double hit: splenic sequestration plus reduced hepatic thrombopoietin; an early marker of portal hypertension"},{"dx":"Dilutional","hook":"Massive transfusion or large-volume crystalloid resuscitation dilutes platelets"},{"dx":"Gestational thrombocytopenia","hook":"Mild (usually >70k), late pregnancy, asymptomatic, no treatment, resolves postpartum; most common cause of low Plt in pregnancy"}]}]},"pearls":["FIRST step for any unexpected low Plt is to repeat the count and review the peripheral smear: pseudothrombocytopenia from EDTA-induced platelet clumping gives a falsely low automated count (redraw in citrate tube).","Schistocytes on smear point to a microangiopathy: differentiate by coags. TTP/HUS have NORMAL PT/PTT/fibrinogen; DIC has prolonged PT/PTT, low fibrinogen, high D-dimer.","TTP vs HUS: TTP is neuro-predominant (adults, ADAMTS13), HUS is renal-predominant (kids, Shiga toxin). Mnemonic: TTP grabs the brain, HUS hits the kidney.","Do NOT transfuse platelets in TTP or HIT (can worsen thrombosis); platelet transfusion in DIC or marrow failure is appropriate if bleeding or counts are critically low.","HIT is the paradox: a LOW platelet count that causes CLOTTING, not bleeding. Suspect with a >50% drop at days 5-10 of heparin; calculate the 4Ts score and switch to argatroban.","Iron deficiency is a classic cause of reactive THROMBOCYTOSIS: low Hgb, low MCV, high Plt is a high-yield shelf pattern.","Bleeding risk by count: spontaneous mucocutaneous bleeding generally below ~10,000-20,000; surgical bleeding risk below ~50,000. Petechiae and mucosal bleeding suggest a platelet (not coagulation factor) problem.","ITP is a diagnosis of exclusion: isolated low Plt with an otherwise normal CBC and smear, no schistocytes, normal coags, no splenomegaly.","In pregnancy, distinguish benign gestational thrombocytopenia (mild, asymptomatic) from HELLP and severe preeclampsia (look for elevated LFTs, hemolysis, hypertension, proteinuria).","Best next test when production is suspected (especially with pancytopenia or abnormal smear): bone marrow biopsy."]},{"id":"rdw","panel":"CBC","name":"Red Cell Distribution Width","abbr":"RDW","normalRange":"11.5-14.5%","units":"%","high":{"heading":"Elevated RDW (Anisocytosis)","note":"RDW measures variation in RBC size. High RDW means a mixed population of cells (anisocytosis). On the shelf, RDW exists mainly to be paired with MCV: it sorts microcytic anemias and flags the early or mixed deficiency before MCV has shifted.","groups":[{"label":"Microcytic split (high RDW vs normal RDW): the classic shelf use","causes":[{"dx":"Iron deficiency anemia","hook":"Low MCV with HIGH RDW. Low ferritin, high TIBC/transferrin, low transferrin saturation. The high RDW is the feature that separates IDA from thalassemia. Confirm with iron studies (ferritin is the single best test)."},{"dx":"Thalassemia (trait)","hook":"Low MCV with NORMAL RDW (uniformly small cells). High-normal/elevated RBC count, normal ferritin, target cells. Beta-thal trait: Hb electrophoresis shows elevated HbA2. Alpha-thal trait: electrophoresis is normal, so it needs genetic testing."},{"dx":"Anemia of chronic disease (some cases)","hook":"Usually normocytic with normal RDW, but can be mildly microcytic. High ferritin, low TIBC distinguishes it from IDA."}]},{"label":"Macrocytic with high RDW","causes":[{"dx":"B12 / folate deficiency (megaloblastic)","hook":"High MCV plus high RDW. Hypersegmented neutrophils, macro-ovalocytes. Check B12, folate, methylmalonic acid (elevated in B12 deficiency only)."}]},{"label":"Early or mixed deficiency (RDW rises before MCV moves)","causes":[{"dx":"Early nutritional deficiency","hook":"RDW is an early marker: it can rise while MCV is still normal, because new abnormal cells join a normal population."},{"dx":"Combined iron + B12/folate deficiency","hook":"Opposing effects on cell size make MCV variable or falsely normal, so the average hides the problem. A high RDW is the clue that unmasks a mixed deficiency when MCV looks normal."}]},{"label":"Mixed cell populations (two RBC sizes coexist)","causes":[{"dx":"Recent RBC transfusion","hook":"Transfused donor cells mixed with the patient's own cells creates a dimorphic population and raises RDW."},{"dx":"Reticulocytosis (hemolysis or post-treatment response)","hook":"Large young retics among mature cells widen the distribution. Seen after starting iron/B12 replacement or in brisk hemolysis."},{"dx":"Myelodysplastic syndrome / sideroblastic anemia","hook":"Dimorphic smear, ringed sideroblasts (sideroblastic). Board-classic but a step beyond the core microcytic split."}]}]},"low":{"heading":"Low RDW","note":"Low RDW is essentially not clinically meaningful and is not tested on the shelf. A low value simply means a uniform RBC population and carries no pathologic significance: there is no differential to memorize. The actionable use of RDW is entirely on the high side.","groups":[]},"pearls":["The single highest-yield use: in a MICROCYTIC anemia, RDW splits the two big causes. Iron deficiency = high RDW; thalassemia = normal RDW (uniformly small cells). RDW sorts them, but confirm with ferritin/iron studies (IDA) and Hb electrophoresis (beta-thal); it is sensitive, not perfectly specific.","RDW is meaningless alone. Always read it next to MCV: MCV tells you the average cell size, RDW tells you whether the cells are uniform or mixed.","RDW can rise EARLY, before MCV changes, because a few abnormal new cells widen the spread before they shift the average. A high RDW with a normal MCV is a clue to early or mixed deficiency.","Mentzer index helps when RDW is equivocal: MCV / RBC count. Greater than 13 favors iron deficiency; less than 13 favors thalassemia.","Normal MCV but high RDW = think combined iron + B12/folate deficiency (opposing size effects cancel out in the average).","A newly high RDW after starting iron or B12 is expected: it reflects the reticulocyte response (new young cells), a sign of treatment working, not a new problem.","Low RDW: no clinical action. Do not invent pathology for it."]},{"id":"neut","panel":"CBC","name":"Neutrophils","abbr":"ANC","normalRange":"40-70% (ANC 1,500-8,000 /µL)","units":"% of WBC differential; ANC in cells/µL","high":{"heading":"Neutrophilia (ANC > 8,000 /µL)","note":"Most common cause is acute bacterial infection. On the shelf, distinguish a true marrow response (left shift, toxic granulation, bands) from a benign demargination effect (stress/steroids, no left shift).","groups":[{"label":"Infection / inflammation (marrow-driven, left shift)","causes":[{"dx":"Acute bacterial infection","hook":"Left shift (bands), toxic granulation, Dohle bodies; the classic answer for an elevated ANC"},{"dx":"Tissue necrosis / inflammation","hook":"MI, burns, pancreatitis, vasculitis: sterile inflammation still recruits neutrophils"},{"dx":"Leukemoid reaction","hook":"WBC > 50,000 with left shift but HIGH LAP (leukocyte alkaline phosphatase); distinguishes from CML"}]},{"label":"Demargination / mobilization (no left shift)","causes":[{"dx":"Corticosteroids","hook":"Demargination + delayed marrow egress + blocked extravasation; neutrophilia with relative lymphopenia"},{"dx":"Acute stress / catecholamines","hook":"Exercise, pain, seizure, epinephrine: shifts marginated pool into circulation within minutes"},{"dx":"Post-splenectomy","hook":"Loss of marginating reservoir; pair with Howell-Jolly bodies and thrombocytosis on smear"}]},{"label":"Chronic / clonal","causes":[{"dx":"Chronic myeloid leukemia (CML)","hook":"WBC often > 100k, full myeloid left shift, basophilia, LOW LAP, t(9;22) BCR-ABL; next step is FISH/PCR"},{"dx":"Cigarette smoking","hook":"Most common cause of chronic mild neutrophilia in an otherwise well outpatient"},{"dx":"Chronic inflammation / malignancy","hook":"RA, IBD, solid tumors driving sustained low-grade neutrophilia"}]}]},"low":{"heading":"Neutropenia (ANC \u003c 1,500 /µL)","note":"Risk is driven by the ANC number, not the percentage. ANC \u003c 500 = severe neutropenia = neutropenic fever is an emergency. Group by the mechanism the shelf tests: decreased production vs increased destruction/margination.","groups":[{"label":"Decreased production (marrow)","causes":[{"dx":"Chemotherapy / radiation","hook":"Most common and most testable cause; nadir ~7-14 days post-cycle, the setup for neutropenic fever"},{"dx":"Drug-induced agranulocytosis","hook":"Clozapine, methimazole/PTU, sulfasalazine, TMP-SMX; isolated ANC near zero, recovers off drug"},{"dx":"Marrow failure / infiltration","hook":"Aplastic anemia, leukemia, myelodysplasia: usually pancytopenia, not isolated neutropenia"},{"dx":"B12 / folate deficiency","hook":"Megaloblastic marrow: hypersegmented neutrophils plus macrocytic anemia"}]},{"label":"Increased destruction / margination / sequestration","causes":[{"dx":"Viral infection","hook":"Most common cause in healthy kids/adults; EBV, HIV, hepatitis, influenza; usually transient and self-limited"},{"dx":"Overwhelming bacterial sepsis","hook":"Consumption outpaces production; neutropenia here is a bad prognostic sign, not reassurance"},{"dx":"Autoimmune neutropenia","hook":"SLE and Felty syndrome (RA + splenomegaly + neutropenia); antineutrophil antibodies"},{"dx":"Hypersplenism","hook":"Splenic sequestration; look for splenomegaly and concurrent thrombocytopenia/anemia"}]},{"label":"Benign / population","causes":[{"dx":"Benign ethnic neutropenia (Duffy-null)","hook":"Mild stable ANC ~1,000-1,500 in patients of African/Middle Eastern descent; no infection risk, no workup needed"}]}]},"pearls":["Always convert to an absolute count: ANC = total WBC x (percent segs + percent bands) / 100. The percentage alone is meaningless; the ANC drives all decisions.","ANC \u003c 500 /µL = severe neutropenia. A single temp >= 38.3 C (or >= 38.0 C sustained 1 hour) = neutropenic fever: draw cultures and start empiric cefepime (or piperacillin-tazobactam) WITHIN 1 HOUR. Do not wait for the source.","Add vancomycin only for specific indications: line infection, skin/soft tissue, hemodynamic instability, or known MRSA. It is not routine empiric coverage.","Left shift (bands, metamyelocytes) signals a true marrow demand from infection; its absence points toward demargination (steroids, stress).","Leukemoid reaction vs CML: both give very high WBC with left shift. LAP is HIGH in a leukemoid reaction (infection) and LOW in CML. Confirm CML with BCR-ABL.","Steroids classically raise the ANC (demargination + blocked egress) while dropping lymphocytes and eosinophils; do not mistake steroid neutrophilia for infection.","A normal or low ANC in a septic-appearing patient is ominous, not reassuring: it suggests consumption/marrow exhaustion.","Single best next test for unexplained isolated neutropenia: review the smear and the medication list first; persistent or severe cases warrant a bone marrow biopsy."]},{"id":"lymph","panel":"CBC","name":"Lymphocytes","abbr":"Lymph","normalRange":"20-40% (1,000-4,000 /µL)","units":"% (and absolute /µL)","high":{"heading":"Lymphocytosis","note":"Shelf framing: split by reactive (infection/stress) vs clonal (malignancy). Always check the smear: atypical (reactive) lymphocytes point to virus, smudge cells point to CLL.","groups":[{"label":"Reactive: viral","causes":[{"dx":"EBV mononucleosis","hook":"Atypical (reactive) lymphocytes, posterior cervical nodes, splenomegaly, positive monospot/heterophile; amoxicillin gives a rash"},{"dx":"CMV mononucleosis","hook":"Mono-like illness with NEGATIVE heterophile/monospot; classic post-transfusion or in immunocompromised"},{"dx":"Acute viral hepatitis / HIV (acute retroviral)","hook":"Atypical lymphocytes + flu-like illness; check HIV RNA, not antibody, in acute seroconversion"}]},{"label":"Reactive: bacterial (board-classic exception)","causes":[{"dx":"Pertussis (Bordetella pertussis)","hook":"Paroxysmal whooping cough in an unvaccinated child; the one bacterial infection that classically causes marked lymphocytosis"}]},{"label":"Clonal / malignant","causes":[{"dx":"Chronic lymphocytic leukemia (CLL)","hook":"Older adult, asymptomatic, SMUDGE cells on smear; confirm clonal B cells with flow cytometry"},{"dx":"Acute lymphoblastic leukemia (ALL)","hook":"Child with blasts, cytopenias, bone pain; lymphoblasts (not mature lymphocytes)"}]},{"label":"Stress / physiologic","causes":[{"dx":"Acute stress lymphocytosis","hook":"Transient, after trauma, MI, or seizure; epinephrine-driven demargination, resolves on its own"}]}]},"low":{"heading":"Lymphopenia","note":"Shelf framing: think loss/destruction (viral, radiation/chemo), redistribution/suppression (steroids, acute stress, sepsis), or primary immunodeficiency. HIV is the single most testable cause.","groups":[{"label":"Infection","causes":[{"dx":"HIV / AIDS","hook":"Progressive CD4 T-cell depletion; opportunistic infections (PCP) when CD4 \u003c 200; the highest-yield lymphopenia on the shelf"},{"dx":"Acute sepsis / severe viral illness (incl. influenza, COVID)","hook":"Transient lymphopenia with acute infection; COVID-19 lymphopenia tracks with severity"}]},{"label":"Iatrogenic / treatment","causes":[{"dx":"Corticosteroids","hook":"Steroids cause lymphopenia (redistribution/apoptosis) but neutrophilia, so total WBC can look normal or high"},{"dx":"Chemotherapy / immunosuppressants","hook":"Cytotoxic marrow suppression; cyclophosphamide, methotrexate, calcineurin inhibitors"},{"dx":"Radiation therapy","hook":"Lymphocytes are the most radiosensitive blood cell; early marker of radiation exposure"}]},{"label":"Autoimmune / nutritional","causes":[{"dx":"SLE","hook":"Lymphopenia is part of the hematologic SLE criteria (along with autoimmune hemolysis, leukopenia, thrombocytopenia)"},{"dx":"Zinc deficiency / protein-energy malnutrition","hook":"Impaired lymphopoiesis; consider in chronic illness or alcohol use"}]},{"label":"Primary immunodeficiency (peds zebras, board-classic)","causes":[{"dx":"SCID","hook":"Infant with absent thymic shadow, recurrent severe infections, failure to thrive; very low/absent T cells"},{"dx":"DiGeorge syndrome (22q11.2 deletion)","hook":"Thymic aplasia + hypocalcemia (tetany) + conotruncal cardiac defects; CATCH-22"}]}]},"pearls":["Always pair the percentage with the ABSOLUTE lymphocyte count (ALC). A high lymphocyte percentage can be relative (from neutropenia) rather than true lymphocytosis; absolute count is what matters.","Atypical (reactive) lymphocytes = viral/reactive (EBV, CMV). Smudge cells = CLL. Lymphoblasts = acute leukemia (ALL). The smear distinguishes them.","EBV mono: monospot/heterophile POSITIVE. CMV mono and acute HIV: heterophile NEGATIVE mono-like illness. Negative monospot with a mono picture should prompt CMV and acute HIV testing.","Steroids drop lymphocytes but raise neutrophils, so the total WBC may rise even as lymphocytes fall; read the differential, not just the WBC.","Persistent absolute lymphocytosis (> 5,000/µL) in an older adult, especially with smudge cells, points to CLL; the single best next test is peripheral blood flow cytometry.","Persistent unexplained lymphopenia (low CD4) should trigger HIV testing; in acute retroviral syndrome order HIV RNA (viral load), since antibody may still be negative.","Pertussis is the classic board exception where a BACTERIAL infection causes marked lymphocytosis (most bacterial infections cause neutrophilia with a left shift instead)."]},{"id":"eos","panel":"CBC","name":"Eosinophils","abbr":"Eos","normalRange":"0-6% (absolute \u003c500 /µL)","units":"% of WBC (absolute eosinophil count in cells/µL)","high":{"heading":"Eosinophilia","note":"Think NAACP. Absolute count matters more than percent: >500 /µL = eosinophilia, >1500 /µL = hypereosinophilia. On the shelf, the answer is usually allergy/atopy, a tissue-invasive parasite, or a drug reaction.","groups":[{"label":"N - Neoplasm","causes":[{"dx":"Hodgkin lymphoma","hook":"Reed-Sternberg cells secrete IL-5; young patient with B symptoms and pruritus"},{"dx":"Chronic myeloid leukemia / myeloproliferative","hook":"eosinophilia plus basophilia; BCR-ABL"},{"dx":"Idiopathic hypereosinophilic syndrome","hook":"eos >1500 /µL x6 months with end-organ damage (heart, lungs, GI); diagnosis of exclusion, check FIP1L1-PDGFRA"}]},{"label":"A - Allergy / Asthma / Atopy","causes":[{"dx":"Atopic disease (asthma, eczema, allergic rhinitis)","hook":"the single most common cause overall; type I IgE-mediated hypersensitivity"},{"dx":"Allergic bronchopulmonary aspergillosis (ABPA)","hook":"asthmatic or CF patient, very high IgE, central bronchiectasis, brown mucus plugs"}]},{"label":"A - Adrenal insufficiency","causes":[{"dx":"Addison disease / adrenal insufficiency","hook":"loss of cortisol removes the normal eosinophil-suppressing signal; pair with hyponatremia + hyperkalemia"}]},{"label":"C - Connective tissue / vasculitis","causes":[{"dx":"Eosinophilic granulomatosis with polyangiitis (EGPA, Churg-Strauss)","hook":"asthma + eosinophilia + mononeuritis multiplex; p-ANCA (MPO) positive in roughly half"},{"dx":"Other CTD (RA, eosinophilic fasciitis)","hook":"chronic inflammatory drive"}]},{"label":"P - Parasites","causes":[{"dx":"Tissue-invasive helminths","hook":"Strongyloides, hookworm, Ascaris, Toxocara, Schistosoma; the buzzword is tissue-invasive, not luminal protozoa (Giardia does NOT cause eosinophilia)"},{"dx":"Strongyloides specifically","hook":"screen and treat before steroids/immunosuppression to avoid hyperinfection syndrome"}]},{"label":"Drug reaction (the practical board favorite)","causes":[{"dx":"DRESS syndrome","hook":"Drug Reaction with Eosinophilia and Systemic Symptoms; fever, rash, eos, transaminitis 2-8 weeks after a new drug (anticonvulsants, allopurinol, sulfa)"},{"dx":"Acute interstitial nephritis (AIN)","hook":"rising Cr + rash + eosinophilia + sterile pyuria with WBC casts after NSAID, PPI, or beta-lactam; stop the drug"},{"dx":"Simple drug hypersensitivity","hook":"asymptomatic eosinophilia from a new medication"}]},{"label":"Skin / other (NAACP extension)","causes":[{"dx":"Eosinophilic esophagitis","hook":"young patient, dysphagia and food impaction, >15 eos/hpf on biopsy, does not respond to PPI alone"},{"dx":"Coccidioidomycosis","hook":"the fungal infection that classically raises eosinophils; Southwest US travel"}]}]},"low":{"heading":"Eosinopenia","note":"Clinically trivial and rarely tested as a disease. Low eosinophils are an expected stress response, not a workup trigger.","groups":[{"label":"Stress / cortisol effect","causes":[{"dx":"Acute stress, infection, or sepsis","hook":"endogenous cortisol and catecholamines marginate/sequester eosinophils; persistent eosinopenia is a marker of acute illness"},{"dx":"Exogenous glucocorticoids","hook":"steroids drop the eosinophil count within hours; Cushing syndrome does the same"}]}]},"pearls":["Absolute eosinophil count (AEC) drives interpretation, not the percent. AEC = WBC x eosinophil%. >500 /µL is eosinophilia; >1500 /µL is hypereosinophilia and prompts evaluation for end-organ damage.","Mnemonic NAACP: Neoplasm (Hodgkin), Allergy/Asthma/Atopy, Adrenal insufficiency (Addison), Connective tissue/Churg-Strauss, Parasites. Add Drugs (DRESS, AIN) as the practical fourth bucket.","Parasite caveat: only tissue-invasive helminths cause eosinophilia. Luminal protozoa (Giardia, Entamoeba, Cryptosporidium) and most established bacterial/viral infections do NOT.","Before starting steroids or immunosuppression in a patient with eosinophilia and the right epidemiology, screen for Strongyloides to prevent fatal hyperinfection/disseminated disease.","Drug reaction triad to recognize fast: AIN = rising creatinine + eosinophiluria after NSAID/PPI/beta-lactam; DRESS = fever + rash + eosinophilia + transaminitis weeks after a new drug. Next step in both is to stop the offending agent.","Most common cause of mild eosinophilia in the US outpatient setting is atopy/allergy; most common worldwide is helminthic infection.","New-onset asthma in an adult plus eosinophilia plus neuropathy should trigger EGPA (Churg-Strauss), p-ANCA/MPO."]},{"id":"na","panel":"CMP","name":"Sodium","abbr":"Na","normalRange":"135-145 mEq/L","units":"mEq/L","high":{"heading":"Hypernatremia (Na > 145)","note":"Almost always a free water problem: water loss exceeds sodium loss, OR access to water is impaired. A patient with intact thirst and access to water will not stay hypernatremic, so it is most common at the extremes of age, the intubated, the bedbound, and the cognitively impaired. Workup hinges on urine osmolality: HIGH (> 600) means appropriate concentration (extrarenal water loss), LOW (\u003c 300) means DI, INTERMEDIATE (300-600) suggests osmotic diuresis.","groups":[{"label":"Pure water loss (urine osm should be HIGH, > 600, if kidneys work)","causes":[{"dx":"Insensible / dermal losses","hook":"Fever, burns, ventilated patient, hot environment; appropriately concentrated urine"},{"dx":"Impaired thirst / no access to water","hook":"Elderly, demented, intubated, stroke, restrained; classic board setup is the nursing-home patient or post-op patient who cannot ask for water"}]},{"label":"Renal water loss, Diabetes Insipidus (urine osm INAPPROPRIATELY LOW, \u003c 300, dilute)","causes":[{"dx":"Central DI","hook":"ADH deficiency (pituitary surgery, trauma, tumor); urine CONCENTRATES after desmopressin (DDAVP) challenge"},{"dx":"Nephrogenic DI","hook":"Kidney resists ADH; lithium and hypercalcemia are the classics; NO response to DDAVP"}]},{"label":"Renal water loss, osmotic diuresis (urine osm INTERMEDIATE, ~300-600)","causes":[{"dx":"Osmotic diuresis","hook":"An unabsorbed solute drags water out: hyperglycemia (DKA/HHS, glucosuria), mannitol, high-protein tube feeds (urea), post-obstructive diuresis or recovering ATN; urine is neither maximally concentrated nor maximally dilute"}]},{"label":"Hypotonic GI losses (Na lost, but water lost more)","causes":[{"dx":"Osmotic / watery diarrhea","hook":"Lactulose, viral gastroenteritis; loses more water than salt relative to plasma"}]},{"label":"Sodium gain (rare, volume OVERloaded, hypervolemic)","causes":[{"dx":"Iatrogenic Na load","hook":"Hypertonic saline, sodium bicarb codes, hypertonic tube feeds; the one hypernatremia that is NOT a water-deficit picture"}]}]},"low":{"heading":"Hyponatremia (Na \u003c 135)","note":"The most common electrolyte abnormality on the wards. Work it up in 3 steps: (1) check serum osmolality to exclude pseudo/non-hypotonic causes, (2) if truly hypotonic, assess VOLUME STATUS, (3) use urine osm and urine Na to localize. Correct slowly to avoid osmotic demyelination.","groups":[{"label":"STEP 1: Not truly hypotonic (rule these out first)","causes":[{"dx":"Pseudohyponatremia","hook":"Severe hyperlipidemia or paraproteinemia (multiple myeloma); serum osm is NORMAL, it is a lab artifact, no true water excess"},{"dx":"Hyperglycemia (hypertonic / translocational)","hook":"Glucose pulls water into vessels; serum osm HIGH. Correct: add 1.6 (use 2.4 if glucose very high) to Na per 100 mg/dL glucose above 100"}]},{"label":"STEP 2a: Hypotonic + HYPOvolemic (dry; urine Na localizes the loss)","causes":[{"dx":"GI / third-space / skin losses","hook":"Vomiting, diarrhea, pancreatitis, burns; kidney avidly retains Na, so urine Na \u003c 20"},{"dx":"Diuretics (esp. thiazides)","hook":"Thiazides classically; impair dilution at distal tubule; urine Na > 20 (renal salt wasting)"},{"dx":"Adrenal insufficiency (Addison)","hook":"Low aldosterone: hyponatremia WITH hyperkalemia; hypotension, hyperpigmentation; urine Na > 20"},{"dx":"Cerebral salt wasting","hook":"Recent SAH/brain injury; truly volume DOWN (vs SIADH which is euvolemic); treat with salt and fluid"}]},{"label":"STEP 2b: Hypotonic + EUvolemic (urine osm is the key)","causes":[{"dx":"SIADH","hook":"Euvolemic, urine osm > 100 (inappropriately concentrated), urine Na > 30, LOW uric acid; small cell lung CA, CNS disease, pain, SSRIs, carbamazepine"},{"dx":"Hypothyroidism","hook":"Severe; check TSH in the euvolemic workup"},{"dx":"Psychogenic polydipsia","hook":"Massive water intake overwhelms kidney; urine osm LOW (\u003c 100), maximally dilute"},{"dx":"Beer potomania / tea-and-toast","hook":"Low solute intake limits free-water excretion; urine osm LOW; malnourished drinker or poor elderly diet"},{"dx":"Glucocorticoid deficiency (secondary)","hook":"Cortisol needed to suppress ADH; isolated low cortisol presents euvolemic, NOT with hyperkalemia"}]},{"label":"STEP 2c: Hypotonic + HYPERvolemic (edematous, low effective circulating volume)","causes":[{"dx":"Heart failure","hook":"Low cardiac output triggers ADH despite total-body overload; urine Na \u003c 20; worse Na = worse prognosis"},{"dx":"Cirrhosis","hook":"Splanchnic vasodilation lowers effective volume; urine Na \u003c 20; ascites and edema"},{"dx":"Nephrotic syndrome","hook":"Hypoalbuminemia, edema; urine Na \u003c 20"},{"dx":"Advanced renal failure","hook":"Kidney cannot excrete free water; urine Na > 20 (cannot conserve Na)"}]}]},"pearls":["Always work hyponatremia in order: serum osm -> volume status -> urine Na and urine osm. Skipping serum osm is the classic trap (misses hyperglycemia and pseudohyponatremia).","Glucose correction: add ~1.6 mEq/L to measured Na for every 100 mg/dL glucose above 100 (use 2.4 when glucose is markedly elevated, e.g., > 400). A normal corrected Na means it is a translocational, not a true water, problem.","SIADH vs hypovolemic hyponatremia: both can have high urine osm, but SIADH is EUVOLEMIC with urine Na > 30 and LOW uric acid; hypovolemia is dry with urine Na \u003c 20. SIADH is a diagnosis of exclusion (normal thyroid, adrenal, renal function).","Urine osm splits euvolemic causes: LOW (\u003c 100) = primary polydipsia or beer potomania (kidney correctly dilutes); HIGH (> 100) = SIADH (ADH inappropriately on).","Hypernatremia mirrors this with urine osm: HIGH (> 600) = appropriate concentration (extrarenal water loss or poor intake); LOW (\u003c 300) = DI; INTERMEDIATE (300-600) = osmotic diuresis (glucose, mannitol, urea).","Correction rate: do NOT raise Na faster than ~8 mEq/L in 24 hours. Overcorrecting chronic hyponatremia causes osmotic demyelination syndrome (central pontine myelinolysis), presenting days later with locked-in/quadriparesis.","Overcorrecting in the OTHER direction (lowering Na too fast in chronic hypernatremia) causes cerebral edema and seizures. Lower hypernatremia by no more than ~10 mEq/L per 24 hours.","Symptomatic / seizing hyponatremia (usually acute, Na typically \u003c 120) is the exception: give hypertonic (3%) saline to raise Na a few points fast, then slow down.","Hyponatremia with HYPERkalemia points to adrenal insufficiency (low aldosterone), not isolated cortisol deficiency.","Lithium and hypercalcemia are the two board causes of nephrogenic DI; pituitary surgery/trauma is the board cause of central DI; the DDAVP challenge tells them apart.","Single best next test for hyponatremia is serum osmolality; single best next test for hypernatremia (once water deficit is clear) is urine osmolality to separate DI from osmotic diuresis from appropriate renal concentration."]},{"id":"k","panel":"CMP","name":"Potassium","abbr":"K","normalRange":"3.5-5.0 mEq/L","units":"mEq/L","high":{"heading":"Hyperkalemia","note":"Always rule out pseudohyperkalemia first, then think decreased excretion vs transcellular shift OUT of cells. Get an EKG immediately.","groups":[{"label":"Pseudohyperkalemia (rule out FIRST, repeat the draw)","causes":[{"dx":"Hemolyzed sample","hook":"K leaks from lysed RBCs in the tube; lab flags hemolysis, patient is asymptomatic with a normal EKG. Redraw."},{"dx":"Fist-clenching / prolonged tourniquet","hook":"Repeated fist-pumping during venipuncture releases K from local muscle; falsely high."},{"dx":"Marked thrombocytosis or leukocytosis","hook":"K released from platelets/WBCs during clotting; serum high but plasma normal. Send a plasma (heparinized) potassium."}]},{"label":"Decreased renal excretion","causes":[{"dx":"AKI / CKD","hook":"Low GFR is the most common true cause; oliguria + rising creatinine. Dialysis if refractory."},{"dx":"K-sparing diuretics","hook":"Spironolactone/eplerenone (aldosterone antagonists) and amiloride/triamterene (ENaC blockers) cut distal K secretion."},{"dx":"ACE inhibitors / ARBs","hook":"Block angiotensin II to aldosterone axis, reducing K excretion; classic in CKD/CHF patients on these meds."},{"dx":"NSAIDs","hook":"Reduce renal prostaglandins, lowering renin/aldosterone and GFR."},{"dx":"Type 4 RTA (hyporeninemic hypoaldosteronism)","hook":"Diabetic nephropathy; non-anion-gap metabolic acidosis WITH hyperkalemia (the only RTA that raises K)."},{"dx":"Primary adrenal insufficiency (Addison)","hook":"Aldosterone deficiency: hyperkalemia + hyponatremia + hypotension + hyperpigmentation. Confirm with cosyntropin stim test."}]},{"label":"Transcellular shift OUT of cells","causes":[{"dx":"Metabolic acidosis","hook":"H+ moves into cells and K moves out (mineral acidosis like NH4Cl shifts more than organic acids such as lactate/ketoacids)."},{"dx":"Insulin deficiency / DKA","hook":"Without insulin, K is not driven into cells, so it shifts out and serum K reads high or normal; hyperosmolality adds to the shift. Total-body K is actually depleted (osmotic diuresis), so K falls fast once insulin + fluids start."},{"dx":"Cell lysis: rhabdomyolysis, tumor lysis syndrome, hemolysis","hook":"Intracellular K dumped into blood. TLS triad: high K, high phosphate, high uric acid, low Ca."},{"dx":"Succinylcholine","hook":"Depolarizing paralytic releases K; dangerous in burns, crush injury, denervation. Avoid in these patients."},{"dx":"Beta-blockers","hook":"Block beta-2 driven K uptake into cells; modest rise."},{"dx":"Digoxin toxicity","hook":"Poisons the Na/K-ATPase so K cannot enter cells; hyperkalemia in acute tox predicts severity."}]}]},"low":{"heading":"Hypokalemia","note":"Frame by GI loss vs renal loss vs transcellular shift IN. Always check magnesium: hypomagnesemia causes refractory hypokalemia and must be repleted first.","groups":[{"label":"GI losses","causes":[{"dx":"Vomiting / NG suction","hook":"Loss is mostly renal (volume depletion drives aldosterone) plus the alkalosis; classic hypokalemic metabolic alkalosis with LOW urine chloride."},{"dx":"Diarrhea / laxative abuse","hook":"Direct stool K loss; produces hypokalemia with a non-anion-gap metabolic ACIDOSIS (contrast with vomiting)."}]},{"label":"Renal losses","causes":[{"dx":"Loop / thiazide diuretics","hook":"Most common cause; increased distal Na delivery drives K wasting. Hypokalemic metabolic alkalosis."},{"dx":"Primary hyperaldosteronism (Conn)","hook":"Hypertension + hypokalemia + metabolic alkalosis with LOW renin. Check aldosterone:renin ratio."},{"dx":"Bartter syndrome","hook":"Mimics a loop diuretic (defective NKCC2); normotensive, hypokalemic alkalosis with renal salt wasting."},{"dx":"Gitelman syndrome","hook":"Mimics a thiazide (defective NCC); normotensive hypokalemic alkalosis PLUS hypomagnesemia and hypocalciuria."},{"dx":"Hypomagnesemia","hook":"Low Mg promotes renal K wasting (ROMK disinhibition); hypokalemia will NOT correct until Mg is repleted."}]},{"label":"Transcellular shift INTO cells","causes":[{"dx":"Metabolic alkalosis","hook":"H+ leaves cells and K enters; pH up, K down."},{"dx":"Insulin (exogenous or post-DKA treatment)","hook":"Drives K into cells; watch the falling K when treating DKA."},{"dx":"Beta-2 agonists","hook":"Albuterol or epinephrine push K intracellularly; also used therapeutically to treat hyperkalemia."}]}]},"pearls":["Get an EKG for any significant hyperkalemia: progression is peaked T waves to widened QRS to PR prolongation/loss of P waves to sine wave to arrest.","Hypokalemia EKG: flattened T waves, ST depression, and U waves; predisposes to torsades, especially with concurrent hypomagnesemia.","Total-body deficit is large relative to the measured drop: each 1 mEq/L fall below ~3.5-4.0 reflects roughly a 200-400 mEq total-body K deficit, so even mild hypokalemia signals a big deficit (and chronic losses are usually larger than acute shifts).","Refractory hypokalemia means check and replete magnesium; low Mg keeps K spilling into urine no matter how much K you give.","Both vomiting and diuretics cause a HYPOKALEMIC METABOLIC ALKALOSIS, whereas diarrhea and type 4 RTA cause hypokalemia/hyperkalemia respectively with a non-anion-gap metabolic acidosis.","Pseudohyperkalemia: high K with a normal EKG and a hemolyzed, clenched-fist, or high platelet/WBC sample. Confirm with a plasma potassium before treating.","Acute hyperkalemia treatment order: IV calcium gluconate FIRST (stabilizes the myocardium, does not lower K), then insulin + glucose and albuterol to shift K in, then kayexalate/patiromer, loop diuretics, or dialysis to remove it.","DKA: serum K is often high or normal at presentation despite a total-body K deficit; it drops once insulin starts, so monitor closely and replete (hold insulin if K is already below ~3.3)."]},{"id":"cl","panel":"CMP","name":"Chloride","abbr":"Cl","normalRange":"98-106 mEq/L","units":"mEq/L","high":{"heading":"Hyperchloremia","note":"Think of chloride as bicarbonate's mirror image. High Cl usually means LOW bicarb: a non-anion-gap (hyperchloremic) metabolic acidosis. The other driver is free-water loss concentrating the serum.","groups":[{"label":"Non-anion-gap metabolic acidosis (HCO3 lost, Cl rises to fill the gap)","causes":[{"dx":"Diarrhea / GI bicarbonate loss","hook":"Most common NAGMA; stool loses HCO3, kidney retains Cl. Negative urine anion gap (kidney appropriately excretes NH4Cl)"},{"dx":"Renal tubular acidosis (all types)","hook":"Classic hyperchloremic normal-gap acidosis. Positive urine anion gap (kidney fails to excrete acid)"},{"dx":"Large-volume normal saline resuscitation","hook":"0.9% NaCl = 154 mEq/L Cl; iatrogenic hyperchloremic acidosis. Switch to balanced crystalloid (LR/Plasma-Lyte)"},{"dx":"Acetazolamide / carbonic anhydrase inhibitor","hook":"Renal HCO3 wasting; drug-induced proximal-RTA picture"}]},{"label":"Free-water deficit (concentration effect, tracks high Na)","causes":[{"dx":"Dehydration","hook":"Cl rises in parallel with Na; correct the water deficit and both fall"},{"dx":"Diabetes insipidus","hook":"Pure water loss raises Na and Cl together; central vs nephrogenic on water deprivation test"}]}]},"low":{"heading":"Hypochloremia","note":"Low Cl pairs with HIGH bicarbonate: the lab signature of metabolic alkalosis. The two board-classic mechanisms are loss of HCl from above (vomiting/NG) and chloride-wasting diuretics.","groups":[{"label":"Loss of chloride-rich fluid (drives metabolic alkalosis)","causes":[{"dx":"Vomiting / NG suction","hook":"Loss of HCl from the stomach; classic hypochloremic, hypokalemic metabolic alkalosis. Low urine Cl (\u003c20), chloride-responsive"},{"dx":"Loop or thiazide diuretics","hook":"Cl wasting in urine, contraction alkalosis; hypokalemia travels along. Urine Cl high while on drug, low after it clears"}]},{"label":"Acid-base (bicarbonate up, chloride shifts down reciprocally)","causes":[{"dx":"Metabolic alkalosis (any cause)","hook":"High HCO3 is electrically balanced by a fall in Cl; check urine Cl to split chloride-responsive vs resistant"},{"dx":"Chronic respiratory acidosis (renal compensation)","hook":"COPD/CO2 retention; kidney retains HCO3 and dumps Cl to compensate. Low Cl with high-normal/high HCO3 and high pCO2"}]},{"label":"Dilution / low sodium states","causes":[{"dx":"SIADH / hypotonic hyponatremia","hook":"Cl falls with Na as a dilutional effect; reflects free-water excess, not chloride pathology"},{"dx":"CHF / cirrhosis (volume overload)","hook":"Dilutional low Na and low Cl; low serum Cl is an emerging marker of worse prognosis in heart failure"}]}]},"pearls":["Read Cl with bicarbonate, not alone: high Cl + low HCO3 = non-anion-gap (hyperchloremic) metabolic acidosis; low Cl + high HCO3 = metabolic alkalosis.","Cl normally moves in lockstep with Na. If Cl rises or falls out of proportion to Na, an acid-base disturbance (not a water/sodium problem) is the reason.","Urine anion gap = (urine Na + urine K) - urine Cl. In NAGMA: negative = GI/diarrheal HCO3 loss (kidney working); positive = RTA (kidney failing to excrete acid).","Urine chloride splits metabolic alkalosis: low (\u003c20) = chloride-responsive (vomiting, NG, prior diuretic, contraction) and saline-responsive; high (>20) = chloride-resistant (hyperaldosteronism, Cushing, current diuretic use, Bartter/Gitelman).","Vomiting gives the triad: low Cl, low K, high HCO3 (hypochloremic hypokalemic metabolic alkalosis).","Large-volume normal saline causes a hyperchloremic metabolic acidosis; if a post-resuscitation patient has high Cl and low HCO3, suspect the fluid and switch to a balanced crystalloid.","Pseudohypochloremia: severe hyperlipidemia or hyperproteinemia can falsely lower Cl by the same electrolyte-exclusion artifact that causes pseudohyponatremia.","Single best next test when Cl is abnormal: the venous/arterial blood gas and bicarbonate to define the acid-base disorder, then urine Cl or urine anion gap to localize the cause."]},{"id":"hco3","panel":"CMP","name":"Bicarbonate","abbr":"HCO3","normalRange":"22-28 mEq/L","units":"mEq/L","high":{"heading":"Metabolic Alkalosis (elevated HCO3)","note":"High HCO3 = metabolic alkalosis. Single best next test is URINE CHLORIDE: \u003c20 = saline-responsive (volume/Cl depleted, give NS), >20 = saline-resistant. If saline-resistant, the next discriminator is BLOOD PRESSURE: high BP = true mineralocorticoid excess, normal/low BP = Bartter/Gitelman or severe K/Mg depletion. (Active diuretic use raises urine Cl and is the great mimic, exclude it first.)","groups":[{"label":"Saline-RESPONSIVE (urine Cl \u003c20, volume/Cl depleted, give NS)","causes":[{"dx":"Vomiting / NG suction loss","hook":"Loss of HCl + volume; classic hypokalemic, hypochloremic 'contraction' alkalosis"},{"dx":"Diuretics (loop / thiazide), after washout","hook":"Contraction alkalosis with hypokalemia; urine Cl is HIGH during active use but drops once the drug wears off (the post-diuretic state is saline-responsive)"},{"dx":"Post-hypercapnia","hook":"Kidney retained HCO3 to compensate chronic CO2 retention; CO2 corrects but HCO3 lags (saline-responsive)"},{"dx":"Cystic fibrosis (sweat Cl loss)","hook":"Hypochloremic, hypokalemic alkalosis from heavy chloride loss in sweat"}]},{"label":"Saline-RESISTANT + HIGH BP (urine Cl >20, true mineralocorticoid excess)","causes":[{"dx":"Primary hyperaldosteronism (Conn)","hook":"HTN + hypokalemia + alkalosis; HIGH aldo, LOW renin"},{"dx":"Cushing syndrome / exogenous steroids","hook":"Cortisol spillover onto the mineralocorticoid receptor; HTN + alkalosis"},{"dx":"Renal artery stenosis (secondary hyperaldosteronism)","hook":"HIGH renin AND high aldo; HTN + hypokalemic alkalosis, abdominal bruit"},{"dx":"Licorice / Liddle syndrome","hook":"Licorice inhibits 11-beta-HSD (cortisol acts on MR); Liddle = constitutive ENaC; both = HTN + alkalosis with LOW aldo and LOW renin"}]},{"label":"Saline-RESISTANT + NORMAL/LOW BP (urine Cl >20, salt-wasting or K/Mg depletion)","causes":[{"dx":"Bartter syndrome","hook":"'Loop-like' defect (NKCC2) in thick ascending limb; hypokalemic alkalosis, NORMAL/low BP, hyperCALCiuria"},{"dx":"Gitelman syndrome","hook":"'Thiazide-like' defect (NCC) in distal tubule; hypokalemic alkalosis, NORMAL/low BP, hypoCALCiuria + hypoMAGnesemia"},{"dx":"Severe hypokalemia / magnesium depletion","hook":"Profound K (or Mg) loss generates and sustains alkalosis WITHOUT mineralocorticoid excess; normotensive; replace Mg or the K won't correct"}]}]},"low":{"heading":"Metabolic Acidosis (low HCO3)","note":"Low HCO3 = metabolic acidosis. THE KEY MOVE: calculate the ANION GAP (see anion gap row). High AG vs normal AG splits the entire differential. Then confirm respiratory compensation with the Winter formula.","groups":
